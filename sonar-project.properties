# SonarCloud (SonarQube Cloud) analysis configuration.
#
# This project uses SonarCloud **Automatic Analysis** (no CI scanner runs in this
# repo). Automatic Analysis honours analysis-*scope* keys from this file — notably
# `sonar.exclusions` — but does NOT honour per-rule issue suppression
# (`sonar.issue.ignore.multicriteria`) or coverage import (`sonar.python.coverage.*`);
# those require switching to CI-based analysis (running the SonarScanner in a
# workflow). Keep that in mind before adding keys here.

# --- Scoped exclusion -------------------------------------------------------------
# Exclude only the wheel-bundling release workflow from analysis. Its build jobs
# check out `github.event.workflow_run.head_branch`, which the GitHub Actions rule
# githubactions:S7631 ("Make sure that no untrusted code is executed from a fork")
# flags as a vulnerability. Every `workflow_run`-triggered job in that file is
# already fork-guarded —
#   if: ... github.event.workflow_run.head_repository.full_name == github.repository
# — so the finding is a false positive: untrusted fork code can never run there.
# Per-rule / per-line suppression is unavailable under Automatic Analysis, so the
# whole file is scoped out here rather than disabling the rule globally.
sonar.exclusions=.github/workflows/bundle-pypi-wheels.yml
