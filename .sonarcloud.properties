# SonarCloud Automatic Analysis configuration.
# ci/source-build/config.sh is a deliberately minimal-diff FORK of rasterio's
# upstream ci/config.sh (pristine copy kept in reference/ for re-syncs);
# restyling ~950 lines of vendored shell to satisfy shell rules would destroy
# the surgical-fork property. Our own scripts (build-gdal-stack.sh etc.)
# remain fully analyzed.
sonar.exclusions=ci/source-build/config.sh,ci/source-build/reference/**
