[project]
name = "pyramids-gis"
version = "0.29.0"
description = "GIS utility package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "gdal"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is intentionally omitted from runtime deps: the platform wheel
# vendors osgeo, conda-forge users get gdal via the feedstock, sdist
# users install native GDAL out-of-band (see docs/installation.md).
# Listing pip's PyPI GDAL would force a from-source build on Windows
# (no wheel exists) and break most end-user pip installs.
dependencies = [
    "cftime >=1.6.4",
    "geopandas >=1.0.0",
    "hpc-utils >=0.1.5",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.0",
    "Shapely >=2.0.0",
    "scipy >=1.10.0",
]

[project.optional-dependencies]
viz = ["cleopatra[tiles]>=0.12.0"]
lazy = [
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "zarr>=3",
    "fsspec>=2024.1.0",
    "s3fs>=2024.1.0",
    "flox>=0.9.0",
]
xarray = ["xarray>=2023.1.0"]
netcdf-lazy = ["pyramids-gis[lazy]", "kerchunk>=0.2.10", "h5py>=3.8.0"]
parquet = ["pyarrow>=10.0.0"]
parquet-lazy = ["pyramids-gis[lazy,parquet]", "dask-geopandas>=0.5.0"]
stac = ["pystac-client>=0.8.0", "stac-asset>=0.4.7"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.scripts]
pyramids = "pyramids.cli:main"

[project.urls]
homepage = "https://github.com/serapeum-org/pyramids"
repository = "https://github.com/serapeum-org/pyramids"
documentation = "https://serapeum-org.github.io/pyramids"
Changelog = "https://github.com/serapeum-org/pyramids/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids", "pyramids.*"]

[tool.setuptools.package-data]
# YAML glob scoped to base/data/ so future test fixtures or plot
# configs dropped under src/pyramids/ don't auto-ship in every wheel.
pyramids = [
    "base/data/*.yaml",
    "_vendor/osgeo/**/*",
    "_vendor/osgeo_utils/**/*",
    "_data/gdal_data/*",
    "_data/proj_data/*",
    "_data/gdalplugins/*",
    # curl CA bundle re-pointed by the runtime bootstrap so vendored-GDAL
    # /vsicurl HTTPS reads find trust anchors in the consuming env (#412).
    "_data/ssl/*",
    # Third-party license texts auto-vendored by
    # ci/install-and-vendor-osgeo.py from each conda-forge package's
    # info/licenses/. Required by MIT/BSD/LGPL attribution clauses for
    # every native lib bundled in pyramids_gis.libs/. See
    # docs/about/THIRD_PARTY_LICENSES.md for the human-readable index.
    "_licenses/**/*",
]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "planning", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/pyramids"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pyramids"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "scripts/",
    "planning/",
]

[[tool.mypy.overrides]]
module = "pyramids.dataset.ops.*"
disable_error_code = [
    "attr-defined", "call-arg", "misc", "return-value",
    "assignment", "union-attr", "no-any-return", "arg-type",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "core: extras-free test (auto-applied when no extras marker is present)",
    "plot: tests requiring the [viz] extra (cleopatra) — plotting tests (deselect with '-m \"not plot\"')",
    # One marker per [project.optional-dependencies] group. Each marker
    # auto-skips when the extra's headline dep isn't importable — see
    # ``tests/_marks.py`` + ``pytest_collection_modifyitems``. ``viz`` is
    # spelled ``plot`` above; don't register a duplicate.
    "lazy: tests requiring the [lazy] extra (dask, distributed, zarr, fsspec, flox)",
    "xarray: tests requiring the [xarray] extra (xarray)",
    "netcdf_lazy: tests requiring the [netcdf-lazy] extra (kerchunk, h5py, + lazy)",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "parquet_lazy: tests requiring the [parquet-lazy] extra (dask-geopandas, + parquet, + lazy)",
    "stac: tests requiring the [stac] extra (pystac-client)",
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
pyramids-gis = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/pyramids -sv -m 'not plot and not xarray' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
xarray-tests = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'xarray' --cov-report=xml", description = "Run xarray interop tests" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore-glob='docs/examples/**/dask-lazy-*.ipynb' --ignore-glob='docs/examples/**/lazy-*-complete.ipynb' --ignore-glob='docs/examples/**/stac-cloud-*.ipynb' --ignore-glob='docs/examples/zarr/*.ipynb'", description = "check notebooks (skips dask cookbooks, stac-cloud-* and zarr/* — all need extras envs or real endpoints)" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }


[tool.pixi.environments]
default = {features = ["viz"], solve-group = "default" }
dev = { features = ["viz", "dev", "xarray", "lazy", "stac", "netcdf-lazy", "parquet", "parquet-lazy"], solve-group = "default" }
netcdf-lazy = { features = ["viz", "dev", "lazy", "netcdf-lazy"], solve-group = "default" }
parquet = { features = ["viz", "dev", "xarray", "lazy", "parquet"], solve-group = "default" }
parquet-lazy = { features = ["viz", "dev", "xarray", "lazy", "parquet", "parquet-lazy"], solve-group = "default" }
notebook = { features = ["viz", "notebook", "lazy"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
# py3XX envs (tests.yml matrix) include `lazy` so the `xarray-tests` step
# has the xarray data stack (zarr / dask / s3fs / fsspec) that the
# xarray-marked interop tests (e.g. LabeledDataset) require — these run
# with real deps, never skipped. `parquet` (pyarrow) is deliberately NOT
# added here: it would un-skip the `core` OGR-Parquet tests, which need
# GDAL's libgdal-arrow-parquet driver (absent on the Linux/macOS runners).
# Those parquet paths are exercised by the parquet extras-package matrix.
# Bare-core (no-lazy) installs are covered by the `default` env.
py311 = { features = ["py311", "viz", "dev", "xarray", "lazy"], solve-group = "py311" }
py312 = { features = ["py312", "viz", "dev", "xarray", "lazy"], solve-group = "py312" }
py313 = { features = ["py313", "viz", "dev", "xarray", "lazy"], solve-group = "py313" }
py314 = { features = ["py314", "viz", "dev", "xarray", "lazy"], solve-group = "py314" }
# wheel-build: lean env inside the cibuildwheel container.
# no-default-feature = true keeps pyramids-gis (and its pandas/numpy
# transitive deps) out of the build container so cibuildwheel's pip
# can resolve them against the target Python's manylinux wheels.
wheel-build = { features = ["wheel-build"], solve-group = "wheel-build", no-default-feature = true }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.dev.dependencies]
scipy = ">=1.17.1,<2"

# dask / distributed / fsspec routed through conda so they share the same numpy
# ABI as libgdal-netcdf / h5py (below). zarr bumped to v3 (was pinned <3 while
# the lazy stack targeted the v2 API — under evaluation).
[tool.pixi.feature.lazy.dependencies]
"dask-core" = ">=2024.1.0"
distributed = ">=2024.1.0"
zarr = ">=3"
fsspec = ">=2024.1.0"
s3fs = ">=2024.1.0"
flox = ">=0.9.0"

# HDF5-linking libraries must come from conda-forge so they share the
# same HDF5 binary that libgdal-netcdf is linked against. PyPI wheels for
# h5py bundle their own HDF5 copy, which causes DLL-shadowing on Windows
# (h5py fails with "DLL load failed while importing defs") once more
# than one HDF5 backend is loaded in-process.
#
# pyramids' lazy NetCDF path is pure GDAL MDArray — it does NOT import
# netCDF4, h5netcdf, or cftime. kerchunk needs h5py to walk HDF5 chunk
# metadata; nothing else in this feature pulls HDF5-adjacent libraries.
[tool.pixi.feature.netcdf-lazy.dependencies]
kerchunk = ">=0.2.10"
# h5py 3.16 moved to hdf5 2.x, but libgdal-netcdf still links hdf5 1.14.x.
# Pin h5py to the last 1.14-compatible release so the whole env shares
# one HDF5 binary. Raise this pin when libgdal-netcdf follows hdf5 2.x.
h5py = ">=3.8.0,<3.16"
# Pin the hdf5 major.minor line explicitly so any future h5py rebuild
# that would drag hdf5 2.x is blocked until libgdal-netcdf follows.
# Without this the solver can pair h5py 3.16 (hdf5 2) with
# libgdal-netcdf (still hdf5 1) and the env silently breaks on Windows.
hdf5 = "1.14.*"

[tool.pixi.feature.parquet.dependencies]
pyarrow = ">=10.0.0"

[tool.pixi.feature.parquet-lazy.dependencies]
dask-geopandas = ">=0.5.0"

[tool.pixi.feature.stac.dependencies]
pystac-client = ">=0.8.0"

# Pinned tighter than [tool.pixi.dependencies] because the SWIG Python
# bindings are version-locked to libgdal. ci/setup-gdal-micromamba.sh
# reads these pins via tomllib for the macOS x86_64 cross-compile path,
# so this block is the single source of truth.
[tool.pixi.feature.wheel-build.dependencies]
gdal = ">=3.12,<3.13"
libgdal-netcdf = ">=3.12,<3.13"
libgdal-hdf4 = ">=3.12,<3.13"
libgdal-grib = ">=3.12,<3.13"
swig = ">=4.3,<5"

# libstdcxx-ng provides the GCC-13 libstdc++.so.6 that conda-forge's GDAL
# is built against (GLIBCXX_3.4.32). Linux-only — Apple Clang and MSVC
# don't use libstdc++. Without this, auditwheel can't resolve the
# SWIG ext's GLIBCXX deps and the manylinux_2_39 tag fails to apply.
[tool.pixi.feature.wheel-build.target.linux-64.dependencies]
libstdcxx-ng = "*"

[tool.pixi.feature.wheel-build.target.linux-aarch64.dependencies]
libstdcxx-ng = "*"


[tool.pixi.dependencies]
gdal = ">=3.10.0,<4"
libgdal-netcdf = ">=3.10.0,<4"
libgdal-hdf4 = ">=3.10.0,<4"
libgdal-grib = ">=3.10.0,<4"
# cftime decodes non-standard NetCDF calendars (360_day, noleap, julian, ...)
# in pyramids.netcdf.utils — reachable from core NetCDF reads, so it is a core dep.
cftime = ">=1.6.4"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file on every env.
pyogrio = ">=0.7"


[tool.cibuildwheel]
# Single place to add a new Python version — beats juggling CIBW_BUILD
# across the three per-OS workflow jobs.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# Excludes for build IDs that match `build` but we don't want (PyPy,
# musllinux, free-threaded 3.14).
skip = ["*pp*", "*musllinux*", "cp314t-*"]
archs = ["auto64"]
build-verbosity = 3
# manylinux_2_39 wheel can't be installed in manylinux_2_28 build
# container (glibc too old), so cibuildwheel can't run a self-test.
# Real wheel tests live in .github/workflows/build-wheels.yml's
# test-wheels matrix instead.
test-skip = "*"

# PACKAGE_DATA + PIXI_NO_PATH_UPDATE are duplicated in each per-platform
# [tool.cibuildwheel.<platform>.environment] block below. Despite docs
# suggesting otherwise, cibuildwheel's `environment` table uses REPLACE
# semantics across overrides, not merge. Hoisting them to a shared
# top-level block silently broke every build with
# "PACKAGE_DATA != 1; skipping" (commit 607d3153).

[tool.cibuildwheel.linux]
# manylinux_2_28 build image covers Ubuntu 20.04+ / RHEL 8+. Need 2_28
# (not 2014) because conda-forge GDAL links symbols newer than glibc 2.17.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Forward the toolchain pins (set in build-wheels.yml's env block) into
# the manylinux container — host env vars don't auto-propagate there.
environment-pass = ["PIXI_VERSION", "MICROMAMBA_VERSION"]
before-all = ["bash ./ci/setup-gdal-from-pixi.sh"]
# install-and-vendor-osgeo.py runs pip WITH build isolation so it picks
# up setuptools>=77 (GDAL 3.12.3's build-system.requires) and a matching
# numpy. Without isolation, the manylinux container's pre-installed
# setuptools 75.5.0 rejects GDAL's PEP 639 license string.
before-build = ["python ./ci/install-and-vendor-osgeo.py"]
# auditwheel walks the .so dep graph, bundles libgdal + transitive deps
# into pyramids_gis.libs/, and rewrites RPATH. Output tagged
# manylinux_2_39 because conda-forge's GDAL is GCC-13 (GLIBCXX_3.4.32);
# tighten when conda-forge ships with older GCC. ${AUDITWHEEL_ARCH} is
# auto-exported by cibuildwheel inside the container (x86_64/aarch64).
repair-wheel-command = [
    "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64 auditwheel repair --plat manylinux_2_39_${AUDITWHEEL_ARCH} -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.linux.environment]
# GDAL_VERSION resolved at runtime by setup-gdal-from-pixi.sh and written
# to ${BUILD_PREFIX}/GDAL_VERSION (source of truth = pixi.lock).
BUILD_PREFIX = "/usr/local"
GDAL_DATA = "/usr/local/share/gdal"
PROJ_DATA = "/usr/local/share/proj"
PROJ_LIB = "/usr/local/share/proj"
PACKAGE_DATA = "1"
LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64"
PIXI_NO_PATH_UPDATE = "1"


# macOS: same pixi/conda-forge flow as Linux, but with .dylib +
# delocate-wheel (macOS equivalent of auditwheel) instead of patchelf.
# Pip build-isolation rationale is the same as the Linux block above.
[tool.cibuildwheel.macos]
before-all = ["bash ./ci/setup-gdal-from-pixi.sh"]
before-build = ["python ./ci/install-and-vendor-osgeo.py"]
# DYLD_LIBRARY_PATH lives in the .macos.environment block so every
# subprocess (before-build, build, repair) inherits the same value.
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.macos.environment]
# /usr/local needs sudo on GitHub macOS runners — use $HOME instead.
BUILD_PREFIX = "/Users/runner/gdal-prefix"
GDAL_DATA = "/Users/runner/gdal-prefix/share/gdal"
PROJ_DATA = "/Users/runner/gdal-prefix/share/proj"
PROJ_LIB = "/Users/runner/gdal-prefix/share/proj"
PACKAGE_DATA = "1"
DYLD_LIBRARY_PATH = "/Users/runner/gdal-prefix/lib"
PIXI_NO_PATH_UPDATE = "1"
# 11.0 = Big Sur; required floor for the arm64 build, safe for x86_64.
MACOSX_DEPLOYMENT_TARGET = "11.0"


# Windows: conda's Library/ nesting + delvewheel for repair.
[tool.cibuildwheel.windows]
before-all = ["powershell -File ci/setup-gdal-from-pixi.ps1"]
before-build = [
    # delvewheel is the only tool we install explicitly (needed for the
    # repair command); setuptools/wheel/numpy arrive via pip's build
    # isolation when install-and-vendor-osgeo.py runs.
    "python -m pip install delvewheel",
    "python ci/install-and-vendor-osgeo.py",
]
# --analyze-existing makes delvewheel walk the dep graph of DLLs ALREADY
# inside the wheel (the GDAL plugins at pyramids/_data/gdalplugins/).
# Without it, gdal_netCDF.dll / gdal_HDF*.dll ship without their
# transitive deps (netcdf.dll, hdf5.dll, …) and NetCDF/HDF open fails at
# runtime with "not recognized as being in a supported file format".
repair-wheel-command = [
    "delvewheel repair --analyze-existing --add-path C:/gdal-prefix/Library/bin -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.windows.environment]
# Forward slashes survive bash/PowerShell/cmd interpolation without
# double-backslash escaping; Windows treats /, \, and mixed paths
# equivalently for built-in APIs.
BUILD_PREFIX = "C:/gdal-prefix"
GDAL_DATA = "C:/gdal-prefix/Library/share/gdal"
PROJ_DATA = "C:/gdal-prefix/Library/share/proj"
PROJ_LIB = "C:/gdal-prefix/Library/share/proj"
PACKAGE_DATA = "1"
PATH = "C:/gdal-prefix/Library/bin;$PATH"
PIXI_NO_PATH_UPDATE = "1"
