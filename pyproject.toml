[project]
name = "pyramids-gis"
version = "0.19.0"
description = "GIS utility package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "gdal"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

dependencies = [
    # GDAL is NOT listed as a pip dep: it's vendored into the wheel
    # (see src/pyramids/_vendor/osgeo/ after build). conda-forge users
    # still get GDAL via conda dependency in the feedstock.
    "GDAL >=3.10.0,<4",
    "geopandas >=1.0.0",
    "hpc-utils >=0.1.5",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.0",
    "Shapely >=2.0.0",
    "scipy >=1.10.0",
]

[project.optional-dependencies]
viz = ["cleopatra[tiles]>=0.8.0"]
lazy = [
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "zarr>=2.17.0,<3",
    "fsspec>=2024.1.0",
    "flox>=0.9.0",
]
xarray = ["xarray>=2023.1.0"]
netcdf-lazy = ["pyramids-gis[lazy]", "kerchunk>=0.2.6", "h5py>=3.8.0"]
parquet = ["pyarrow>=10.0.0"]
parquet-lazy = ["pyramids-gis[lazy,parquet]", "dask-geopandas>=0.5.0"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/pyramids"
repository = "https://github.com/serapeum-org/pyramids"
documentation = "https://serapeum-org.github.io/pyramids"
Changelog = "https://github.com/serapeum-org/pyramids/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids", "pyramids.*"]

[tool.setuptools.package-data]
pyramids = [
    "**/*.yaml",
    "_vendor/osgeo/**/*",
    "_vendor/osgeo_utils/**/*",
    "_data/gdal_data/*",
    "_data/proj_data/*",
    "_data/gdalplugins/*",
]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "planning", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/pyramids"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pyramids"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "scripts/",
    "planning/",
]

[[tool.mypy.overrides]]
module = "pyramids.dataset.ops.*"
disable_error_code = [
    "attr-defined", "call-arg", "misc", "return-value",
    "assignment", "union-attr", "no-any-return", "arg-type",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "core: extras-free test (auto-applied when no extras marker is present)",
    "plot: tests requiring the [viz] extra (cleopatra) — plotting tests (deselect with '-m \"not plot\"')",
    # One marker per remaining [project.optional-dependencies] group.
    # Each marker auto-skips when the extra's headline dep is not
    # importable (see ``tests/_marks.py`` + ``pytest_collection_modifyitems``
    # in ``tests/conftest.py``) so test authors declare intent once via
    # ``@pytest.mark.<extra>`` rather than repeating ``try/except
    # ImportError`` boilerplate. The [viz] extra is already covered by
    # the ``plot`` marker above — don't register a duplicate ``viz`` one.
    "lazy: tests requiring the [lazy] extra (dask, distributed, zarr, fsspec, flox)",
    "xarray: tests requiring the [xarray] extra (xarray)",
    "netcdf_lazy: tests requiring the [netcdf-lazy] extra (kerchunk, h5py, + lazy)",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "parquet_lazy: tests requiring the [parquet-lazy] extra (dask-geopandas, + parquet, + lazy)",
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pyramids-gis = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/pyramids -sv -m 'not plot and not xarray' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
xarray-tests = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'xarray' --cov-report=xml", description = "Run xarray interop tests" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore-glob='docs/examples/**/dask-lazy-*.ipynb' --ignore-glob='docs/examples/**/lazy-*-complete.ipynb'", description = "check notebooks (skips dask cookbooks — cloud-data ones hit real endpoints; local-data ones need extras envs)" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }


[tool.pixi.environments]
default = {features = ["viz"], solve-group = "default" }
dev = { features = ["viz", "dev", "xarray", "lazy"], solve-group = "default" }
netcdf-lazy = { features = ["viz", "dev", "lazy", "netcdf-lazy"], solve-group = "default" }
parquet = { features = ["viz", "dev", "xarray", "lazy", "parquet"], solve-group = "default" }
parquet-lazy = { features = ["viz", "dev", "xarray", "lazy", "parquet", "parquet-lazy"], solve-group = "default" }
notebook = { features = ["viz", "notebook"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
py311 = { features = ["py311", "viz", "dev", "xarray"], solve-group = "py311" }
py312 = { features = ["py312", "viz", "dev", "xarray"], solve-group = "py312" }
py313 = { features = ["py313", "viz", "dev", "xarray"], solve-group = "py313" }
py314 = { features = ["py314", "viz", "dev", "xarray"], solve-group = "py314" }
# wheel-build: minimal env used inside the cibuildwheel container to
# obtain GDAL + native deps as conda-forge binaries. Kept separate from
# dev so it stays lean (no pytest, docs tooling, etc.). Uses
# `no-default-feature = true` so we DON'T pull in pyramids-gis itself
# (which would drag in pandas/numpy wheels that may not be manylinux2014
# compatible). See planning/bundle/option-1-implementation-plan.md.
wheel-build = { features = ["wheel-build"], solve-group = "wheel-build", no-default-feature = true }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.dev.dependencies]
scipy = ">=1.17.1,<2"

# Pin zarr via conda because conda-forge defaults to zarr v3 and the
# pyramids lazy stack still targets the v2 API. Also routes dask /
# distributed / fsspec through conda so they share the same numpy ABI as
# libgdal-netcdf / h5py (below).
[tool.pixi.feature.lazy.dependencies]
"dask-core" = ">=2024.1.0"
distributed = ">=2024.1.0"
zarr = ">=2.17.0,<3"
fsspec = ">=2024.1.0"
flox = ">=0.9.0"

# HDF5-linking libraries must come from conda-forge so they share the
# same HDF5 binary that libgdal-netcdf is linked against. PyPI wheels for
# h5py bundle their own HDF5 copy, which causes DLL-shadowing on Windows
# (h5py fails with "DLL load failed while importing defs") once more
# than one HDF5 backend is loaded in-process.
#
# pyramids' lazy NetCDF path is pure GDAL MDArray — it does NOT import
# netCDF4, h5netcdf, or cftime. kerchunk needs h5py to walk HDF5 chunk
# metadata; nothing else in this feature pulls HDF5-adjacent libraries.
[tool.pixi.feature.netcdf-lazy.dependencies]
kerchunk = ">=0.2.6"
# h5py 3.16 moved to hdf5 2.x, but libgdal-netcdf still links hdf5 1.14.x.
# Pin h5py to the last 1.14-compatible release so the whole env shares
# one HDF5 binary. Raise this pin when libgdal-netcdf follows hdf5 2.x.
h5py = ">=3.8.0,<3.16"
# Pin the hdf5 major.minor line explicitly so any future h5py rebuild
# that would drag hdf5 2.x is blocked until libgdal-netcdf follows.
# Without this the solver can pair h5py 3.16 (hdf5 2) with
# libgdal-netcdf (still hdf5 1) and the env silently breaks on Windows.
hdf5 = "1.14.*"

[tool.pixi.feature.parquet.dependencies]
pyarrow = ">=10.0.0"

[tool.pixi.feature.parquet-lazy.dependencies]
dask-geopandas = ">=0.5.0"

# ---------------------------------------------------------------------------
# wheel-build feature: native deps we need inside the cibuildwheel container.
# Deliberately pinned tighter than the runtime [tool.pixi.dependencies] block
# because the SWIG Python bindings are version-locked to libgdal. Keep
# GDAL_VERSION in the cibuildwheel environment aligned with what conda-forge
# delivers for these pins.
# ---------------------------------------------------------------------------
[tool.pixi.feature.wheel-build.dependencies]
gdal = ">=3.12,<3.13"
libgdal-netcdf = ">=3.12,<3.13"
libgdal-hdf4 = ">=3.12,<3.13"
swig = ">=4.3,<5"

# libstdcxx-ng is Linux-only — provides libstdc++.so.6 built by
# conda-forge's newer GCC. conda-forge's GDAL references GLIBCXX_3.4.32
# (GCC 13+), which isn't in the default manylinux_2_28 libstdc++. See
# planning/bundle/option-1-implementation-plan.md Task 1.10.
[tool.pixi.feature.wheel-build.target.linux-64.dependencies]
libstdcxx-ng = "*"


[tool.pixi.dependencies]
gdal = ">=3.10.0,<4"
libgdal-netcdf = ">=3.10.0,<4"
libgdal-hdf4 = ">=3.10.0,<4"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file on every env.
pyogrio = ">=0.7"


# ---------------------------------------------------------------------------
# cibuildwheel: platform wheel builds with bundled GDAL
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
skip = ["*pp*", "*musllinux*", "cp310-*", "cp39-*", "cp38-*", "cp314t-*"]
archs = ["auto64"]
build-verbosity = 3
# NOTE: CIBW_TEST_SKIP = "*" is a temporary Phase 1 workaround. The wheel
# is tagged manylinux_2_39 but the manylinux_2_28 build container can't
# install it (glibc baseline too old). Proper testing happens outside
# cibuildwheel via wheel-test.yml (Phase 3 / Task 3.1).
test-skip = "*"

[tool.cibuildwheel.linux]
# manylinux_2_28 == glibc 2.28; covers Ubuntu 20.04+, RHEL 8+, Debian 11+.
# We use 2_28 instead of 2014 because conda-forge's GDAL binaries link
# to glibc symbols newer than 2.17. See auditwheel output on first build.
manylinux-x86_64-image = "manylinux_2_28"
# CIBW_BEFORE_ALL runs ONCE per platform (shared across Python versions).
# Installs pixi, runs pixi install -e wheel-build, extracts conda-forge
# binaries into /usr/local.
before-all = [
    "bash ./ci/setup-gdal-from-pixi.sh",
]
# CIBW_BEFORE_BUILD runs per Python version. Builds the GDAL SWIG Python
# bindings for the target interpreter, then vendors osgeo/ and
# GDAL_DATA/PROJ_DATA into the pyramids source tree so setuptools
# includes them in the wheel.
before-build = [
    # Use `python -m pip` (not bare `pip`) so the build venv's pip is
    # consistently invoked. `pip install --upgrade pip` is forbidden on
    # Windows (pip.exe is locked while running) and on macOS it can
    # leave pip in a new location where subsequent commands lose sight
    # of just-installed packages like numpy.
    #
    # Pins:
    #   setuptools<77 — GDAL 3.12.3 pyproject.toml uses the deprecated
    #     project.license = {text=...} table form. Setuptools >=77
    #     hard-rejects this (PEP 639 enforcement). Until GDAL ships a
    #     fixed pyproject.toml, we have to install with older setuptools.
    #   numpy<2.4 — numpy 2.4.x has a macOS Accelerate symbol bug on
    #     Apple Silicon runners (Symbol not found:
    #     _cblas_caxpy$NEWLAPACK$ILP64). Pinning <2.4 across all platforms
    #     keeps the build set consistent.
    "python -m pip install 'setuptools<77' wheel 'numpy<2.4'",
    "python ./ci/install-and-vendor-osgeo.py",
]
# Linux wheel repair: auditwheel walks the .so dep graph, bundles
# libgdal and all transitive native deps into pyramids_gis.libs/,
# and patches RPATH so the extensions find their bundled libs at runtime.
#
# auditwheel --plat manylinux_2_39_x86_64 (glibc 2.39, Ubuntu 24.04+)
# because conda-forge's GDAL is compiled with GCC 13, which references
# GLIBCXX_3.4.32. The manylinux_2_28 image itself is fine as a BUILD
# environment; the output wheel's compatibility tag just reflects the
# newer symbols bundled inside. Tighten this as conda-forge releases
# packages compiled with older GCC.
repair-wheel-command = [
    "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64 auditwheel repair --plat manylinux_2_39_x86_64 -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.linux.environment]
# GDAL_VERSION must match the version conda-forge ships for the pin in
# [tool.pixi.feature.wheel-build.dependencies]. Currently GDAL 3.12.3.
GDAL_VERSION = "3.12.3"
BUILD_PREFIX = "/usr/local"
GDAL_DATA = "/usr/local/share/gdal"
PROJ_DATA = "/usr/local/share/proj"
PROJ_LIB = "/usr/local/share/proj"
PACKAGE_DATA = "1"
LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64"
PIXI_NO_PATH_UPDATE = "1"


# ---------------------------------------------------------------------------
# macOS configuration (Phase 4). Uses same pixi/conda-forge approach as
# Linux, but with .dylib libs + delocate-wheel for repair + install_name_tool
# for @loader_path patching.
# ---------------------------------------------------------------------------
[tool.cibuildwheel.macos]
before-all = [
    "bash ./ci/setup-gdal-from-pixi.sh",
]
before-build = [
    # Use `python -m pip` (not bare `pip`) so the build venv's pip is
    # consistently invoked. `pip install --upgrade pip` is forbidden on
    # Windows (pip.exe is locked while running) and on macOS it can
    # leave pip in a new location where subsequent commands lose sight
    # of just-installed packages like numpy.
    #
    # Pins:
    #   setuptools<77 — GDAL 3.12.3 pyproject.toml uses the deprecated
    #     project.license = {text=...} table form. Setuptools >=77
    #     hard-rejects this (PEP 639 enforcement). Until GDAL ships a
    #     fixed pyproject.toml, we have to install with older setuptools.
    #   numpy<2.4 — numpy 2.4.x has a macOS Accelerate symbol bug on
    #     Apple Silicon runners (Symbol not found:
    #     _cblas_caxpy$NEWLAPACK$ILP64). Pinning <2.4 across all platforms
    #     keeps the build set consistent.
    "python -m pip install 'setuptools<77' wheel 'numpy<2.4'",
    "python ./ci/install-and-vendor-osgeo.py",
]
# delocate-wheel is the macOS equivalent of auditwheel: it walks the
# .dylib dep graph, bundles transitive deps into the wheel, and patches
# @loader_path install names so dylibs find each other at runtime.
repair-wheel-command = [
    "DYLD_LIBRARY_PATH=$BUILD_PREFIX/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.macos.environment]
GDAL_VERSION = "3.12.3"
# macOS can't write to /usr/local without sudo on GitHub runners; use a
# writable prefix under $HOME instead.
BUILD_PREFIX = "/Users/runner/gdal-prefix"
GDAL_DATA = "/Users/runner/gdal-prefix/share/gdal"
PROJ_DATA = "/Users/runner/gdal-prefix/share/proj"
PROJ_LIB = "/Users/runner/gdal-prefix/share/proj"
PACKAGE_DATA = "1"
DYLD_LIBRARY_PATH = "/Users/runner/gdal-prefix/lib"
PIXI_NO_PATH_UPDATE = "1"
# Minimum macOS version: 11.0 for arm64, 10.15 for x86_64.
# cibuildwheel sets this based on runner; these are safe defaults.
MACOSX_DEPLOYMENT_TARGET = "11.0"


# ---------------------------------------------------------------------------
# Windows configuration (Phase 5). Uses pixi-pack's Library/ layout
# (Windows conda packages nest under Library/) and delvewheel.
# ---------------------------------------------------------------------------
[tool.cibuildwheel.windows]
before-all = [
    "powershell -File ci/setup-gdal-from-pixi.ps1",
]
before-build = [
    # Use `python -m pip` (not bare `pip`) — see the Linux/macOS
    # before-build above for rationale. On Windows specifically, pip.exe
    # refuses self-upgrade ("ERROR: To modify pip, please run the
    # following command: python.exe -m pip install --upgrade pip").
    # Same setuptools/numpy pins as Linux/macOS — see those sections for
    # the rationale (GDAL pyproject.toml license, numpy Accelerate bug).
    "python -m pip install 'setuptools<77' wheel 'numpy<2.4' delvewheel",
    "python ci/install-and-vendor-osgeo.py",
]
# delvewheel is the Windows equivalent of auditwheel: it bundles required
# DLLs into the wheel. --add-path tells it where to find the DLLs to bundle.
repair-wheel-command = [
    "delvewheel repair --add-path C:/gdal-prefix/Library/bin -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.windows.environment]
GDAL_VERSION = "3.12.3"
# Windows pixi envs put DLLs/headers under .pixi/envs/<env>/Library/
# following conda/Anaconda Windows conventions.
# NOTE: Use forward slashes so the values survive bash/PowerShell/cmd
# interpolation without double-backslash escaping surprises. Windows
# treats /, \, and mixed paths equivalently for built-in APIs.
BUILD_PREFIX = "C:/gdal-prefix"
GDAL_DATA = "C:/gdal-prefix/Library/share/gdal"
PROJ_DATA = "C:/gdal-prefix/Library/share/proj"
PROJ_LIB = "C:/gdal-prefix/Library/share/proj"
PACKAGE_DATA = "1"
PATH = "C:/gdal-prefix/Library/bin;$PATH"
PIXI_NO_PATH_UPDATE = "1"
