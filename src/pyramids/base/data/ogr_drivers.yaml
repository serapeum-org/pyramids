geojson:
  GDAL Name: GeoJSON
  Long name: GeoJSON
  Creation: yes
  Geo-referencing: yes
  Build requirements: Built-in by default
  # Dot-less, like every raster row: `get_driver_name_by_extension` is given
  # a stripped suffix, so a leading dot here never matched. The unquoted
  # `None` on the other rows likewise parsed as the *string* "None",
  # leaving them reachable by a lookup for "None" — both are the bugs
  # fixed on the raster catalog; the vector one carried them too.
  extension: geojson

