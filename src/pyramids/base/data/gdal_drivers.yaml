memory:
  GDAL Name: MEM
  Long name: In Memory Dataset
  Creation: yes
  Copy: yes
  Geo-referencing: yes
  Build requirements: Built-in by default
  # A real YAML null. Unquoted `None` parses as the *string* "None", which would
  # make this in-memory row reachable by extension lookup - `path="x.None"`
  # resolving to MEM, i.e. a disk path silently building a raster that writes
  # nothing. It was safe only because the resolver lowercases the suffix.
  extension: null

geotiff:
  GDAL Name: GTiff
  Long name: GeoTIFF File Format
  Creation: yes
  Copy: yes
  Geo-referencing: yes
  Build requirements: Built-in by default
  # `extension` is the canonical spelling - what `get_extension` returns when
  # building a filename. `aliases` are further spellings that resolve to the
  # same driver; GDAL reports `tif tiff` for GTiff.
  extension: tif
  aliases:
    - tiff


