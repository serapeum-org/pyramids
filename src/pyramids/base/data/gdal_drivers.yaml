raster lite:
  GDAL Name: Rasterlite
  Long name: Rasters in SQLite DB
  Creation: No
  Copy: yes
  Geo-referencing: yes
  Build requirements: libsqlite3

# NOTE: this entry describes the RasterLite2 raster driver (see Build requirements),
# but `GDAL Name` says SQLite, which resolves to GDAL's *vector* SQLite driver. That
# vector driver reports Create=YES, so an automated Creation-flag audit will flag this
# row as a mismatch. It is not one: `Creation: No` is correct for the raster intent.
# Changing `GDAL Name` to RasterLite2 would be more accurate but makes the entry
# unresolvable in builds without librasterlite2.
sqLite:
  GDAL Name: SQLite
  Long name: Rasters in SQLite DB
  Creation: No
  Copy: yes
  Geo-referencing: yes
  Build requirements: libsqlite3, librasterlite2, libspatialite

