name: Build Platform Wheels

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build wheels from (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
      upload-to-pypi:
        description: "Upload to PyPI (leave false to dry-run; publish job is also commented out by default)"
        type: boolean
        default: false
  pull_request:
    # Auto-run on every push to a PR — primary path for branch testing
    # while this workflow isn't yet on the default branch. Remove or
    # narrow (e.g. `paths:`) once the workflow lands on main.
    branches: [main]
  release:
    types: [released]
  workflow_call:

permissions:
  contents: read

# GDAL_VERSION is resolved at runtime by ci/setup-gdal-from-pixi.{sh,ps1}
# from the actual pixi/micromamba env (written to ${BUILD_PREFIX}/GDAL_VERSION).
# Single source of truth = pixi.lock. The pin range lives in
# [tool.pixi.feature.wheel-build.dependencies] in pyproject.toml.

jobs:
  # -------------------------------------------------------------------------
  # Build source distribution (pure Python, no vendored GDAL).
  # Kept for conda-forge feedstock which compiles from sdist.
  # -------------------------------------------------------------------------
  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # -------------------------------------------------------------------------
  # Build Linux platform wheels with bundled GDAL via pixi + conda-forge.
  # -------------------------------------------------------------------------
  build-linux-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}

      - name: Report wheel sizes
        shell: bash
        run: |
          for whl in wheelhouse/*.whl; do
            size=$(stat -c%s "$whl")
            size_mb=$(awk "BEGIN {printf \"%.1f\", $size/1048576}")
            echo "::notice::$(basename $whl): ${size_mb} MB"
            if [ "$size" -gt $((120 * 1024 * 1024)) ]; then
              echo "::error::Wheel exceeds 120 MB size budget — see planning/bundle/wheel-size-analysis.md"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # -------------------------------------------------------------------------
  # Build macOS platform wheels (arm64 native + x86_64 cross-compiled).
  # Both run on macos-14 (Apple Silicon) because GitHub's macos-13 (Intel)
  # runner queue is unusable in practice — jobs sit queued for hours.
  # cibuildwheel handles x86_64 cross-compile on arm64 via Rosetta + ARCHFLAGS.
  # The pixi wheel-build env is installed for the target platform via
  # --platform osx-64 / --platform osx-arm64, so we link against the right
  # libgdal regardless of host arch.
  # -------------------------------------------------------------------------
  build-macos-wheels:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-macosx_${{ matrix.arch }} cp312-macosx_${{ matrix.arch }} cp313-macosx_${{ matrix.arch }}"
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # -------------------------------------------------------------------------
  # Build Windows platform wheels via pixi + conda-forge.
  # -------------------------------------------------------------------------
  build-windows-wheels:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-win_amd64 cp312-win_amd64 cp313-win_amd64"
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # -------------------------------------------------------------------------
  # Test the built wheels in a clean environment (no conda, no system GDAL).
  # Covers Linux / macOS / Windows across cp311/cp312/cp313.
  # -------------------------------------------------------------------------
  test-wheels:
    needs: [build-linux-wheels, build-macos-wheels, build-windows-wheels]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS x86_64 testing is omitted here: the wheel is cross-compiled
        # on macos-14 (arm64) so we can't install it on the same runner,
        # and macos-13 (Intel) GitHub runners queue indefinitely. Native
        # arm64 testing below covers the import-time vendor bootstrap on
        # macOS; x86_64 runtime gets exercised by downstream users on
        # their own Intel machines.
        os: [ubuntu-latest, macos-14, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: wheels-linux-x86_64
            wheel-tag: manylinux
          - os: macos-14
            arch: arm64
            artifact: wheels-macos-arm64
            wheel-tag: macosx
          - os: windows-2022
            arch: AMD64
            artifact: wheels-windows-AMD64
            wheel-tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install wheel (no conda, no system GDAL)
        shell: bash
        # --no-deps: the wheel's metadata declares `GDAL >=3.10.0,<4`
        # (kept for sdist/conda-forge users), but the platform wheel
        # vendors GDAL's Python bindings under pyramids/_vendor/osgeo/.
        # Without --no-deps, pip would try to install GDAL from PyPI,
        # which has no Windows wheels and would force a from-source
        # compile in the test runner. The remaining runtime deps
        # (geopandas, numpy, pandas, ...) are installed explicitly.
        run: |
          PYTAG=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          WHEEL=$(ls dist/pyramids_gis-*-${PYTAG}-${PYTAG}-*${{ matrix.wheel-tag }}*.whl | head -1)
          echo "Installing: $WHEEL"
          pip install --no-deps "$WHEEL"
          pip install \
            "geopandas>=1.0.0" \
            "hpc-utils>=0.1.5" \
            "numpy>=2.0.0" \
            "pandas>=2.0.0" \
            "pyproj>=3.7.0" \
            "PyYAML>=6.0.0" \
            "Shapely>=2.0.0" \
            "scipy>=1.10.0"
          pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import (exercises vendor bootstrap)
        run: |
          python -c "
          import pyramids
          from osgeo import gdal, ogr, osr
          print(f'pyramids {pyramids.__version__}')
          print(f'GDAL {gdal.__version__}')
          sr = osr.SpatialReference(); sr.ImportFromEPSG(4326)
          assert sr.GetAttrValue('AUTHORITY', 1) == '4326'
          ds = gdal.GetDriverByName('MEM').Create('', 10, 10, 1, gdal.GDT_Byte)
          ds.SetGeoTransform([0, 1, 0, 0, 0, -1])
          ds.SetProjection(sr.ExportToWkt())
          import osgeo
          assert '_vendor' in osgeo.__file__, f'osgeo not from vendor: {osgeo.__file__}'
          print('All runtime checks passed.')
          "

      - name: Run core test suite
        shell: bash
        # `core` is auto-applied by tests/conftest.py to every test that
        # doesn't carry an extras marker (plot/xarray/lazy/etc.). Same
        # convention as wheel-test.yml::test-wheel-core. Extras-gated
        # tests auto-skip when their extra isn't installed (we install
        # the bare wheel only).
        #
        # --timeout=60: pytest-timeout aborts any single test that runs
        #   longer than 60 seconds. Caps the blast radius of a hung
        #   test (we saw a real hang on windows-2022 in run
        #   25988610633 — the step burned 17+ minutes with no progress).
        # --timeout-method=thread: signal-based timeouts don't work on
        #   Windows, so use the thread-based method which is portable.
        # Step-level timeout-minutes is a backstop in case pytest
        #   itself deadlocks before reaching a test.
        timeout-minutes: 10
        run: pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m core tests/

  # -------------------------------------------------------------------------
  # Publish to PyPI using the PYPI_PUBLISH token (same secret as
  # pypi-release.yml, same tooling pattern — twine via pixi).
  #
  # Gate: only runs on `release` events or `workflow_dispatch` with
  # `upload-to-pypi=true`. Disabled by default — uncomment to enable.
  # -------------------------------------------------------------------------
