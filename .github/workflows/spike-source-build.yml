name: From-source GDAL wheels (manylinux_2_28 + musllinux)

# Combined scope (#332 Phase 2 + #333 G1): build the Linux wheel family from
# the curated source stack — glibc (manylinux_2_28, replaces the conda-extract
# 2_39 wheels) and musl (musllinux_1_2, a platform conda-forge cannot serve at
# all) — across x86_64 + aarch64 and CPython 3.11-3.14, then validate on the
# distros the old wheel could not reach (Debian 12, Rocky 9) and on Alpine.
# See planning/bundle/gap-wheels-plan.md + from-source-phase1-results.md.

# workflow_dispatch only registers from the default branch, so the branch
# self-triggers on pushes (spike-scoped).
on:
  workflow_dispatch:
  push:
    branches: ["spike/from-source-gdal"]

env:
  WHEEL_SIZE_BUDGET_MB: "60"
  WHEEL_INSTALLED_BUDGET_MB: "150"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc-x86_64
            runner: ubuntu-latest
            archs: x86_64
            build: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
            plat: manylinux_2_28_x86_64
          - name: glibc-aarch64
            runner: ubuntu-24.04-arm
            archs: aarch64
            build: "cp311-manylinux_aarch64 cp312-manylinux_aarch64 cp313-manylinux_aarch64 cp314-manylinux_aarch64"
            plat: manylinux_2_28_aarch64
          - name: musl-x86_64
            runner: ubuntu-latest
            archs: x86_64
            build: "cp311-musllinux_x86_64 cp312-musllinux_x86_64 cp313-musllinux_x86_64 cp314-musllinux_x86_64"
            plat: musllinux_1_2_x86_64
          - name: musl-aarch64
            runner: ubuntu-24.04-arm
            archs: aarch64
            build: "cp311-musllinux_aarch64 cp312-musllinux_aarch64 cp313-musllinux_aarch64 cp314-musllinux_aarch64"
            plat: musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist the compiled dep stack (tar of /usr/local created by
      # build-gdal-stack.sh inside the container, staged under the mounted
      # project dir) so iterations skip the ~50-min compile when the build
      # scripts are unchanged. Key includes both scripts + flavor/arch.
      - name: Cache the built GDAL stack
        uses: actions/cache@v4
        with:
          path: .srcbuild-cache
          key: srcbuild-${{ matrix.name }}-${{ hashFiles('ci/source-build/config.sh', 'ci/source-build/build-gdal-stack.sh') }}

      - name: Build wheels (from-source GDAL, ${{ matrix.plat }})
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs }}
          # Override the TOML skip (which excludes *musllinux*) uniformly;
          # the TOML [tool.cibuildwheel.linux.environment] block still applies
          # and matches the /usr/local install prefix.
          CIBW_SKIP: "*pp* cp314t-*"
          CIBW_BEFORE_ALL: "bash ./ci/source-build/build-gdal-stack.sh"
          CIBW_REPAIR_WHEEL_COMMAND: >-
            LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64
            auditwheel repair --plat ${{ matrix.plat }} -w {dest_dir} {wheel}

      - name: Report wheel sizes
        shell: bash
        run: bash ci/check-wheel-size.sh wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          retention-days: 3

  # The distros that motivate the glibc drop: Debian 12 (2.36) and Rocky 9
  # (2.34) cannot install today's manylinux_2_39 wheel. seccomp=unconfined:
  # GDAL's netCDF driver opens nc-inside-archives (/vsizip) only via Linux
  # userfaultfd, which docker's default seccomp blocks (identical requirement
  # for the conda-extract wheel — its test job runs uncontained).
  verify-debian12:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim-bookworm
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheels-glibc-x86_64
          path: wheelhouse

      - name: Show glibc
        run: ldd --version | head -1

      - name: Install libexpat (documented slim-image requirement, manylinux policy whitelists it)
        run: apt-get update -qq && apt-get install -y -qq libexpat1

      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*manylinux_2_28_x86_64.whl)
          echo "installing ${WHEEL}"
          pip install "${WHEEL}"
          pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Run hermetic core test suite
        run: pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m "core and not vfs and not slow" tests/

  verify-rocky9:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
      options: --security-opt seccomp=unconfined
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheels-glibc-x86_64
          path: wheelhouse

      - name: Install python 3.12 + show glibc
        run: |
          dnf install -y -q python3.12 python3.12-pip
          ldd --version | head -1

      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*manylinux_2_28_x86_64.whl)
          echo "installing ${WHEEL}"
          python3.12 -m pip install "${WHEEL}"
          python3.12 -m pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python3.12 ci/verify-wheel.py

      - name: Run hermetic core test suite
        run: python3.12 -m pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m "core and not vfs and not slow" tests/

  # Alpine/musl (#333): conda-forge can never serve this platform. Vector
  # file I/O is unavailable there until pyogrio ships musllinux wheels
  # (pyogrio is deliberately not a hard dep), so the suite is raster/netCDF
  # scoped; extras-marked tests auto-skip via the conftest.
  verify-alpine:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: python:3.12-alpine
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheels-musl-x86_64
          path: wheelhouse

      - name: Install bash (alpine ships only busybox sh; explicit shell:bash steps need it)
        shell: sh
        run: apk add --no-cache bash

      - name: Show libc
        run: apk info musl 2>/dev/null | head -1 || ldd 2>&1 | head -1

      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*musllinux_1_2_x86_64.whl)
          echo "installing ${WHEEL}"
          pip install "${WHEEL}"
          pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Run raster/netCDF-scoped core suite
        run: >-
          pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread
          -m "core and not vfs and not slow"
          tests/base tests/netcdf tests/test_io.py tests/test_grib.py
