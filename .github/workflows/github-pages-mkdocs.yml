name: Deploy MkDocs

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# All jobs in this workflow push the built docs to the single shared `gh-pages`
# branch via `mike deploy --push`. Without a concurrency guard, deploys from
# concurrent PRs (and main pushes) race to push `gh-pages` and the loser gets a
# non-fast-forward rejection ("Updates were rejected because the remote contains
# work that you do not have locally"). Serialize every run of this workflow onto
# one lane so the pushes queue instead of colliding. `cancel-in-progress: false`
# keeps a queued run rather than cancelling an in-flight push (a cancelled
# `gh-pages` push can leave the branch half-updated).
concurrency:
  group: mkdocs-gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-pr:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      timeout-minutes: 30
      permissions:
        contents: write
        pages: write
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@cb1baebe72f571981605ab895a45dae7bfb566ba  # mkdocs/v1.2.0
        with:
          trigger: 'pull_request'
          package-manager: 'pixi'
          install-groups: 'docs'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
          # Execute the example notebooks in CI so the rendered docs show real
          # outputs (plots/tables). Excluded (the notebooks-exclude list below):
          # the first four need extras envs or live endpoints; the last two are
          # heavy notebooks whose executed outputs (live map tiles / mesh renders
          # + an inline jshtml animation) are multi-MB and byte-different on every
          # run, which bloats the shared gh-pages branch (see #761).
          notebooks-path: 'docs/examples'
          notebooks-exclude: |
            netcdf/dask-lazy-netcdf.ipynb
            feature/dask-lazy-features.ipynb
            stac/stac-cloud-earth-search.ipynb
            dataset/wms-wmts-readers.ipynb
            basemap/basemap-example.ipynb
            netcdf/ugrid/ugrid-mesh-exploration.ipynb
          notebooks-continue-on-error: 'true'

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@cb1baebe72f571981605ab895a45dae7bfb566ba  # mkdocs/v1.2.0
      with:
        trigger: 'main'
        package-manager: 'pixi'
        install-groups: 'docs'
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        notebooks-path: 'docs/examples'
        # See the deploy-pr job above for the rationale: the last two entries
        # in notebooks-exclude below are the heavy notebooks kept out of CI
        # execution so their multi-MB, non-deterministic outputs no longer
        # bloat the shared gh-pages branch (see #761).
        notebooks-exclude: |
          netcdf/dask-lazy-netcdf.ipynb
          feature/dask-lazy-features.ipynb
          stac/stac-cloud-earth-search.ipynb
          dataset/wms-wmts-readers.ipynb
          basemap/basemap-example.ipynb
          netcdf/ugrid/ugrid-mesh-exploration.ipynb
        notebooks-continue-on-error: 'true'

  deploy-release:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@cb1baebe72f571981605ab895a45dae7bfb566ba  # mkdocs/v1.2.0
      with:
        trigger: 'release'
        package-manager: 'pixi'
        install-groups: "docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'
        notebooks-path: 'docs/examples'
        # See the deploy-pr job above for the rationale: the last two entries
        # in notebooks-exclude below are the heavy notebooks kept out of CI
        # execution so their multi-MB, non-deterministic outputs no longer
        # bloat the shared gh-pages branch (see #761).
        notebooks-exclude: |
          netcdf/dask-lazy-netcdf.ipynb
          feature/dask-lazy-features.ipynb
          stac/stac-cloud-earth-search.ipynb
          dataset/wms-wmts-readers.ipynb
          basemap/basemap-example.ipynb
          netcdf/ugrid/ugrid-mesh-exploration.ipynb
        notebooks-continue-on-error: 'true'
