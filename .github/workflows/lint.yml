name: Lint

# The static gate that the test matrix (tests.yml) does not provide. tests.yml runs
# pytest + nbval across the OS/Python matrix, but nothing in CI runs the pre-commit
# hooks, mypy, or the src doctests — so a formatting slip, a ruff violation, a leaked
# secret, a type error, or a rotted `>>>` example could reach main unnoticed. This
# workflow closes that gap. It stays out of tests.yml so a slow test leg never blocks
# the sub-two-minute lint feedback, and vice versa.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, environment-free hooks: ruff (lint + format), the file/format/security
  # checks, beautysh, shellcheck. Formatting and linting are identical on every OS and
  # Python version, so this runs ONCE (no matrix) on a plain runner in ~1-2 min.
  #
  # SKIP drops the hooks that need the pixi dev env: pytest-check and notebook-check are
  # already the tests.yml matrix's job (running them here would duplicate it and pin to
  # one Python), while mypy and doctest run in the `static` job below. no-commit-to-branch
  # is a local commit guard that would misfire in CI, which legitimately runs on main.
  #
  # pixi-lock-check is deliberately out of CI scope: `pixi lock --check` re-solves against
  # live conda/PyPI channels, so it fails on *upstream* churn (a new build of an unrelated
  # transitive dep), not just on our own pyproject-vs-lock drift — that would make every
  # PR flaky. Lock freshness stays enforced by the local pixi-lock-check hook (scoped to
  # pyproject.toml/pixi.lock edits) plus PR review; a stale-lock PR still installs and runs
  # against the resolved env, so tests.yml exercises real code either way.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No fetch-depth: `pre-commit run --all-files` scans the working tree, not history.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Cache the hook toolchains (each hook repo builds an isolated env on first run).
      # Keyed on the config so a hook or rev bump rebuilds; restore-keys reuse the rest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      # Pin the resolved version (reproducible CI, and satisfies the supply-chain
      # "lock resolved versions" check); bump deliberately or via dependabot.
      - run: python -m pip install pre-commit==4.5.1

      - name: Run pre-commit hooks
        # --show-diff-on-failure prints exactly what the auto-fixers (ruff-format,
        # end-of-file-fixer, ...) would change, so a contributor sees the fix to apply.
        # gitleaks is skipped here: its hook scans only staged changes (empty after a CI
        # checkout), so it is inert in --all-files; the dedicated `gitleaks` job below
        # scans the whole tree and is the real CI secret gate.
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: no-commit-to-branch,gitleaks,mypy,pytest-check,doctest,notebook-check,pixi-lock-check

  # Type check and doctests. Both need the full `dev` pixi env (typed deps and an
  # importable package) but neither is platform- or Python-version-sensitive, so one
  # runner covers them. Neither runs anywhere else in CI today.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@cb1baebe72f571981605ab895a45dae7bfb566ba  # pixi/v1.2.0
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Type check with mypy
        run: pixi run -e dev mypy

      - name: Doctests (src)
        # The same check as the `doctest` pre-commit hook: run the shipped `>>>` examples
        # in src. MPLBACKEND=Agg forces the headless matplotlib backend so no example
        # opens a GUI window; -p no:cacheprovider disables the pytest cache plugin.
        env:
          MPLBACKEND: Agg
        run: pixi run -e dev pytest --doctest-modules src -p no:cacheprovider

  # The repo's secret gate. gitleaks is the single secret scanner (it replaced
  # detect-secrets). The pre-commit hook only scans staged changes, which are empty in
  # CI, so this job scans the whole working tree — every tracked file, notebooks
  # included — with the ci/gitleaks.toml allowlist.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Scan for secrets (gitleaks)
        # Pinned binary + SHA256 verification (avoids the gitleaks-action org-license
        # requirement). `gitleaks dir` exits non-zero on a leak, which fails the job.
        run: |
          VER=8.30.0
          SHA=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSL --proto '=https' --proto-redir '=https' -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . -c ci/gitleaks.toml --redact --no-banner
