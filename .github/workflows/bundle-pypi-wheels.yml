name: Bundle PyPI Wheels

on:
  push:
    branches: [main]
#   pull_request:
#     branches: [main]
#     paths:
#       - "pyproject.toml"
#       - "setup.py"
#       - "ci/**"
#       - ".github/workflows/bundle-pypi-wheels.yml"
  workflow_run:
    workflows: ["github-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build wheels from (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
      dry_run_release:
        description: "Also run the release job's gather + composition gate (stops before upload/publish)"
        required: false
        default: false
        type: boolean

# Every push / workflow_run runs to completion independently: a merge to main must always
# be fully built and verified, even if a later commit lands while its pipeline is still
# running, so nothing ever reaches main unverified. Those events get a per-run group
# (github.run_id is unique per run) so they never queue behind — or cancel — one another.
# Only pull_request builds share a per-branch group with cancel-in-progress, so a new push
# to a PR supersedes its older run and frees the hosted-runner pool. NOTE: the on.pull_request
# trigger is currently commented out above, so the PR arm is dormant future-proofing today —
# every live event resolves to the unique github.run_id group. It activates if that trigger is restored.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WHEEL_SIZE_BUDGET_MB: "120"
  # Uncompressed (install-footprint) ceiling enforced by ci/check-wheel-size.sh
  # (T3.1, #474). Generous backstop above the current per-platform footprint
  # (~143 MB Linux x86_64 post-#471); catches a regression without false-failing.
  WHEEL_INSTALLED_BUDGET_MB: "250"
  # Toolchain pins for the conda GDAL-extraction scripts (ci/setup-gdal-*.sh,
  # .ps1) used by macOS / Windows, whose cibuildwheel runs before-all on the
  # host and inherits these directly. The Linux wheels build from source
  # (ci/source-build/) and no longer need them.
  PIXI_VERSION: "0.68.1"
  MICROMAMBA_VERSION: "2.6.1"
  # x86_64 uv for the Rosetta verify-macos-x86_64 job. Pinned + SHA256-verified
  # like the other toolchain fetches (never `latest/download`): this job gates
  # the PyPI publish, so a rolling/tampered binary must not silently pass or
  # break the wheel verification. Bump both together — the checksum is of
  # uv-x86_64-apple-darwin.tar.gz for UV_VERSION.
  UV_VERSION: "0.11.29"
  UV_SHA256: "c4c4de482da9ccdd076dc4fb5cfe7b740609029385c72f58606be3153602387d"

jobs:
  build-sdist:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # head_branch (not head_sha) — github-release pushes the bump + lockfile commits AFTER
          # the workflow_run head_sha is captured; we need the branch tip to see them.
          # The push/dispatch fallback is github.sha (the immutable triggering commit), NOT
          # github.ref: a branch ref re-resolves per job, so a commit landing mid-run made the
          # verify jobs check out newer tests than the wheels were built from — an ImportError
          # on a symbol added by a PR that merged 12 min into run 28900224956.
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build --only-binary=:all:
          python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 3

  build-linux-wheels:
    # Linux wheels are built FROM SOURCE (#332): pyproject's
    # [tool.cibuildwheel.linux] runs ci/source-build/build-gdal-stack.sh as
    # before-all and tags manylinux_2_28. A compiled-stack cache keeps warm
    # builds at ~15 min; cold (build-script changes) ~60 min.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Skipped on release (workflow_run) builds ON PURPOSE: these wheels
      # publish to PyPI, and restoring the native stack from actions/cache
      # would make the release artifact's provenance "whatever the cache
      # contained" (cache-poisoning-to-release vector). A cold release build
      # costs ~60 min once per release and compiles everything from the
      # SHA256-pinned source tarballs.
      - name: Cache the built GDAL stack
        if: github.event_name != 'workflow_run'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .srcbuild-cache
          key: >-
            srcbuild-glibc-${{ matrix.arch }}-${{
            hashFiles('ci/source-build/config.sh', 'ci/source-build/build-gdal-stack.sh') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # The before-all script persists the compiled-stack tar through
          # cibuildwheel's /host mount (the project dir is a copy, not a
          # mount) — forward the runner workspace path it needs.
          HOST_WORKSPACE: ${{ github.workspace }}
          CIBW_ENVIRONMENT_PASS_LINUX: HOST_WORKSPACE

      - name: Report wheel sizes
        shell: bash
        run: |
          bash ci/check-wheel-size.sh wheelhouse
          # T3.2 (#474): best-effort size delta vs the previous PyPI release.
          # Non-fatal — never block the build on the comparison.
          python3 ci/wheel-size-delta.py wheelhouse || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  build-musl-wheels:
    # CANARY ONLY — built and verified but NOT published (#333): a naive
    # `pip install pyramids-gis` on Alpine currently fails upstream of us
    # (geopandas hard-requires pyogrio, which ships no musllinux wheels and
    # whose sdist needs gdal-config). Publishing waits on upstream pyogrio
    # musl wheels. The `canary-` artifact prefix keeps these out of the
    # release job's `{sdist,wheels-*}` download pattern.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
            build: "cp311-musllinux_x86_64 cp312-musllinux_x86_64 cp313-musllinux_x86_64 cp314-musllinux_x86_64"
            plat: musllinux_1_2_x86_64
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
            build: "cp311-musllinux_aarch64 cp312-musllinux_aarch64 cp313-musllinux_aarch64 cp314-musllinux_aarch64"
            plat: musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Unlike the glibc job, this cache is NOT gated off workflow_run: the
      # musl canaries are never published (excluded from the release job's
      # needs + download pattern), so cache-restored binaries can't reach
      # PyPI from here.
      - name: Cache the built GDAL stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .srcbuild-cache
          key: >-
            srcbuild-musl-${{ matrix.arch }}-${{
            hashFiles('ci/source-build/config.sh', 'ci/source-build/build-gdal-stack.sh') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # The before-all script persists the compiled-stack tar through
          # cibuildwheel's /host mount (the project dir is a copy, not a
          # mount) — forward the runner workspace path it needs.
          HOST_WORKSPACE: ${{ github.workspace }}
          CIBW_ENVIRONMENT_PASS_LINUX: HOST_WORKSPACE
          # Override the TOML skip (which excludes *musllinux*) and the glibc
          # repair --plat; before-all/environment come from the TOML linux
          # block, which applies to musllinux builds too.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_SKIP: "*pp* cp314t-*"
          CIBW_REPAIR_WHEEL_COMMAND: >-
            LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64
            auditwheel repair --plat ${{ matrix.plat }} -w {dest_dir} {wheel}

      - name: Report wheel sizes
        shell: bash
        run: bash ci/check-wheel-size.sh wheelhouse

      # pyogrio has no musllinux wheels on PyPI (the #333 publish blocker).
      # Build one here against the canary's own GDAL stack (restored from the
      # tar that before-all wrote into .srcbuild-cache/) so verify-alpine can
      # exercise the FULL suite, vector I/O included, and so the recipe is a
      # ready-made upstream contribution. Canary-only — never published.
      - name: Build pyogrio musllinux wheel against the canary stack
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            quay.io/pypa/musllinux_1_2_${{ matrix.arch }} bash -c '
              set -euo pipefail
              STACK_TAR=$(ls -t .srcbuild-cache/gdal-stack-*-musl-*.tar.gz | head -1)
              tar -C / -xzf "${STACK_TAR}"
              export PATH="/usr/local/bin:${PATH}"
              export LD_LIBRARY_PATH="/usr/local/lib:/usr/local/lib64"
              PYBIN=$(ls -d /opt/python/cp312*/bin | head -1)
              "${PYBIN}/pip" wheel "pyogrio==0.13.0" --no-deps -w /tmp/pyogrio-raw
              auditwheel repair --plat "musllinux_1_2_$(uname -m)" \
                  -w /project/pyogrio-wheelhouse /tmp/pyogrio-raw/pyogrio-*.whl
            '
          ls -lah pyogrio-wheelhouse/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-pyogrio-${{ matrix.arch }}
          path: pyogrio-wheelhouse/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-musl-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  build-macos-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      # NOTE: the wheel size/leak gate (ci/check-wheel-size.sh) runs only in the
      # Linux build job. Adding it here trips CodeQL's cache-poisoning rule
      # (a repo script run in a workflow_run-triggered job). The data trim that
      # changes wheel size (install-and-vendor-osgeo.py) already runs on every
      # platform; only the post-build *assertion* is Linux-only. See #474 / the
      # PR review notes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  build-windows-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      # See the macOS job: the size/leak gate is Linux-only to avoid CodeQL's
      # cache-poisoning rule; the size-changing trim runs on all platforms.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  # Windows-on-ARM wheels (#334, PUBLISHED). conda-forge has no
  # win-arm64 GDAL, so the stack builds from source via vcpkg
  # (ci/vcpkg.json + ci/setup-gdal-from-vcpkg.ps1, staging the same
  # C:/gdal-prefix/Library layout the conda path produces — only
  # before-all differs from the AMD64 job). shapely and pyogrio ship no
  # win_arm64 wheels upstream, so the dependency markers skip them (and
  # geopandas) on this platform and install-and-vendor-osgeo.py vendors
  # the whole vector stack into the wheel per Python version. cp311 is
  # excluded — numpy and scipy ship no cp311 win_arm64 wheels.
  build-winarm64-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Skipped on release (workflow_run) builds like the glibc job:
      # these wheels publish to PyPI now, so release artifacts always
      # cold-build from the pinned vcpkg snapshot instead of restoring
      # cache-stored binaries.
      - name: Cache the vcpkg-built GDAL stack
        if: github.event_name != 'workflow_run'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed
          key: >-
            vcpkg-arm64-${{
            hashFiles('ci/vcpkg.json', 'ci/setup-gdal-from-vcpkg.ps1') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_WINDOWS: ARM64
          # No cp311: numpy/scipy ship no ARM64 cp311 wheels. The release
          # composition gate expects one fewer win_arm64 wheel than the
          # other platforms (`pyvers - 1`) — keep the two in step when
          # this list changes (e.g. adding cp315 or dropping cp311).
          CIBW_BUILD: "cp312-win_arm64 cp313-win_arm64 cp314-win_arm64"
          CIBW_BEFORE_ALL_WINDOWS: powershell -File ci/setup-gdal-from-vcpkg.ps1

      - name: Report wheel sizes
        shell: bash
        run: bash ci/check-wheel-size.sh wheelhouse

      # The vector stack (shapely/pyogrio/geopandas) is vendored inside
      # each wheel by install-and-vendor-osgeo.py during before-build —
      # no separate canary wheels exist anymore.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-winarm64
          path: wheelhouse/*.whl
          retention-days: 3


  test-wheels:
    needs: [build-linux-wheels, build-macos-wheels, build-windows-wheels]
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-2022]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: wheels-linux-x86_64
            wheel-tag: manylinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: wheels-linux-aarch64
            wheel-tag: manylinux
          - os: macos-14
            arch: arm64
            artifact: wheels-macos-arm64
            wheel-tag: macosx
          - os: windows-2022
            arch: AMD64
            artifact: wheels-windows-AMD64
            wheel-tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install wheel
        shell: bash
        run: |
          PYTAG=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          WHEEL=$(ls dist/pyramids_gis-*-${PYTAG}-${PYTAG}-*${{ matrix.wheel-tag }}*.whl | head -1)
          echo "Installing: $WHEEL"
          pip install "$WHEEL" --only-binary=:all:
          pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:

      - name: Verify GDAL import
        run: python ci/verify-wheel.py

      - name: Run core test suite
        shell: bash
        # --timeout-method=thread: signal-based timeouts don't work on Windows.
        # Exclude vfs/slow: a few `core` tests (e.g. TestSubsetLiveNWM) also read
        # LIVE remote datasets over /vsicurl and flake on connection resets /
        # timeouts on the runners, intermittently failing the wheel smoke job.
        # The bundled wheel's network path is covered deterministically by
        # verify-wheel.py's /vsicurl CA check; this step stays hermetic.
        timeout-minutes: 10
        run: pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m "core and not vfs and not slow" tests/

  # Old-glibc reach validation — the distros the pre-#332 manylinux_2_39
  # wheel could not install on. seccomp=unconfined: GDAL's netCDF driver
  # opens nc-inside-archives (/vsizip) only via Linux userfaultfd, which
  # docker's default seccomp blocks (identical requirement for every build
  # model; the uncontained test-wheels jobs never hit it).
  verify-debian12:
    needs: build-linux-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.12-slim-bookworm
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Show glibc
        run: ldd --version | head -1

      # No apt-get libexpat1 here ON PURPOSE: expat is linked statically into
      # libgdal (build_expat, EXPAT_SHARED_LIBS=OFF), so importing the wheel
      # on a bare slim image with zero extra system packages is exactly what
      # this job proves. If this step ever needs a package install again, the
      # wheel has regressed to depending on the host.
      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*manylinux_2_28_x86_64.whl)
          pip install "${WHEEL}" --only-binary=:all:
          pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Run hermetic core test suite
        run: pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m "core and not vfs and not slow" tests/

  verify-rocky9:
    needs: build-linux-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rockylinux:9
      options: --security-opt seccomp=unconfined
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Install python 3.12 + show glibc
        run: |
          dnf install -y -q python3.12 python3.12-pip
          ldd --version | head -1

      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*manylinux_2_28_x86_64.whl)
          python3.12 -m pip install "${WHEEL}" --only-binary=:all:
          python3.12 -m pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python3.12 ci/verify-wheel.py

      - name: Run hermetic core test suite
        run: >-
          python3.12 -m pytest -vvv -o "pythonpath=" --timeout=60
          --timeout-method=thread -m "core and not vfs and not slow" tests/

  # Same old-glibc reach check for the aarch64 wheel: without this, the
  # newly shipped manylinux_2_28_aarch64 wheel would only ever meet
  # glibc 2.39 (the arm runner's own Ubuntu 24.04) and its 2.28-era
  # compatibility would rest on the toolchain argument alone.
  verify-rocky9-aarch64:
    needs: build-linux-wheels
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    container:
      image: rockylinux:9
      options: --security-opt seccomp=unconfined
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-linux-aarch64
          path: wheelhouse

      - name: Install python 3.12 + show glibc
        run: |
          dnf install -y -q python3.12 python3.12-pip
          ldd --version | head -1

      - name: Install wheel
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*manylinux_2_28_aarch64.whl)
          python3.12 -m pip install "${WHEEL}" --only-binary=:all:
          python3.12 -m pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python3.12 ci/verify-wheel.py

      - name: Run hermetic core test suite
        run: >-
          python3.12 -m pytest -vvv -o "pythonpath=" --timeout=60
          --timeout-method=thread -m "core and not vfs and not slow" tests/

  # Alpine/musl canary (#333, not published). PyPI's pyogrio still has no
  # musllinux wheels (the publish blocker), so build-musl-wheels compiles a
  # canary pyogrio against its own stack; with it installed, vector I/O works
  # and this job runs the full core suite (base, netCDF, io, grib, dataset,
  # feature).
  verify-alpine:
    needs: build-musl-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.12-alpine
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    steps:
      - name: Install bash (alpine ships only busybox sh)
        shell: sh
        run: apk add --no-cache bash

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canary-musl-x86_64
          path: wheelhouse

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canary-pyogrio-x86_64
          path: pyogrio-wheelhouse

      # Install the canary-built pyogrio wheel FIRST: with the distribution
      # already present, `pip install geopandas` resolves its pyogrio>=0.7.2
      # requirement instead of falling back to the sdist (the exact failure
      # PyPI Alpine users would hit — see #333). Everything else still
      # installs explicitly because the pyramids wheel itself goes in
      # --no-deps.
      - name: Install wheel + canary pyogrio (full vector I/O)
        shell: bash
        run: |
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*musllinux_1_2_x86_64.whl)
          pip install "${WHEEL}" --no-deps
          pip install pyogrio-wheelhouse/pyogrio-*.whl --only-binary=:all:
          pip install numpy pandas scipy shapely pyproj PyYAML cftime hpc-utils packaging --only-binary=:all:
          pip install geopandas --only-binary=:all:
          pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Run hermetic core test suite (full — vector I/O via canary pyogrio)
        run: >-
          pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread
          -m "core and not vfs and not slow"
          tests/base tests/netcdf tests/io
          tests/dataset tests/feature

  # Native win_arm64 verification (no emulation — the runner executes
  # its own arch), one cell per shipped Python: `pip install <wheel>`
  # resolves the closure wheels-only (--only-binary; the dependency markers
  # skip shapely/geopandas, which the wheel vendors), then verify-wheel checks
  # drivers, the vendored vector stack, licenses, netCDF, JP2, and
  # schannel TLS. The full hermetic suite runs once, on 3.12.
  verify-winarm64:
    needs: build-winarm64-wheels
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-winarm64
          path: wheelhouse

      - name: Install wheel (wheels-only resolution — no source builds)
        shell: bash
        run: |
          PYTAG="cp$(echo '${{ matrix.python-version }}' | tr -d .)"
          WHEEL=$(ls wheelhouse/pyramids_gis-*${PYTAG}*win_arm64.whl)
          pip install "${WHEEL}" --only-binary=:all:

      # Runs against the bare install closure, BEFORE the test deps land:
      # pytest itself requires `packaging`, which the vendored geopandas
      # imports at runtime, so installing pytest first masked a hole in
      # the wheel's own dependency closure (caught in PR #695 review).
      - name: Verify GDAL import + drivers (vector stack, netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Install test dependencies
        if: matrix.python-version == '3.12'
        run: "pip install pytest pytest-env pytest-mock pytest-timeout --only-binary=:all:"

      - name: Run hermetic core test suite
        if: matrix.python-version == '3.12'
        shell: bash
        timeout-minutes: 15
        run: >-
          pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread
          -m "core and not vfs and not slow" tests/

  # The macOS x86_64 wheel is cross-compiled on this arm64 macos-14 host, so
  # cibuildwheel can't run it, and GitHub's macos-13 Intel runners are unusable
  # in practice (an added macos-13 test cell sat queued 12h, never assigned a
  # runner). Verify the wheel here instead by running an x86_64 CPython under
  # Rosetta 2 on this same arm64 runner: install the wheel into an x86_64 venv
  # and run verify-wheel (GDAL import + all promised drivers + TLS) on every
  # shipped CPython. This is the only place `import pyramids` runs on the x86_64
  # wheel before it publishes. The behavioural pytest suite is arch-independent
  # and runs natively on the arm64/linux/windows test-wheels cells; re-running it
  # under Rosetta emulation only adds per-test-timeout flakiness (a heavy
  # curvilinear read tripped the 60s cap under emulation), so it is omitted here.
  verify-macos-x86_64:
    needs: build-macos-wheels
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.sha }}

      - name: Ensure Rosetta 2 is available
        run: |
          set -euo pipefail
          # macos-14 arm64 runners generally ship Rosetta 2, so tolerate the
          # already-installed / no-op case, but then prove x86_64 emulation
          # actually works — otherwise a genuine failure is swallowed here and
          # resurfaces as a confusing error in a later `arch -x86_64` step.
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true || {
            echo "::error::Rosetta 2 x86_64 emulation is unavailable on this runner"
            exit 1
          }

      - name: Install a pinned, checksummed x86_64 uv (runs under Rosetta)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' -o uv-x86_64.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-apple-darwin.tar.gz"
          echo "${UV_SHA256}  uv-x86_64.tar.gz" | shasum -a 256 -c -
          tar -xzf uv-x86_64.tar.gz
          echo "UVX86=$PWD/uv-x86_64-apple-darwin/uv" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-macos-x86_64
          path: dist

      - name: Install the x86_64 wheel into an x86_64 venv (Rosetta)
        run: |
          set -euo pipefail
          # only-managed forces uv to download an x86_64 python-build-standalone
          # interpreter (uv runs under Rosetta here) instead of reusing a
          # pre-installed arm64 Homebrew python, which macos-14 ships for some
          # versions and which would make the x86_64 wheel install as wrong-arch.
          arch -x86_64 "$UVX86" venv --python-preference only-managed \
            --python ${{ matrix.python-version }} .venv-x86
          PYTAG="cp$(echo '${{ matrix.python-version }}' | tr -d .)"
          WHEEL=$(ls dist/pyramids_gis-*-${PYTAG}-${PYTAG}-*macosx*x86_64.whl | head -1)
          echo "Installing: $WHEEL"
          arch -x86_64 "$UVX86" pip install --python .venv-x86/bin/python "$WHEEL" --only-binary=:all:

      - name: Verify GDAL import + drivers (x86_64 under Rosetta)
        run: |
          set -euo pipefail
          # Confirm the venv really is x86_64 (not a stray arm64 interpreter)
          # without `assert`, which `python -O` would strip.
          M=$(arch -x86_64 .venv-x86/bin/python -c "import platform;print(platform.machine())")
          [ "$M" = "x86_64" ] || { echo "::error::venv python is $M, expected x86_64"; exit 1; }
          arch -x86_64 .venv-x86/bin/python ci/verify-wheel.py

  release:
    name: Publish to PyPI + attach to GitHub release
    # NOTE: the musl canary wheels stay UNPUBLISHED (their `canary-*`
    # artifacts can't match the download pattern and the composition gate
    # rejects them) until upstream pyogrio ships musllinux wheels (#333).
    # win_arm64 wheels PUBLISH as of #334's graduation (the wheel vendors
    # its vector stack). Every verify job gates the release, canaries
    # included — maintainer decision after 0.40.0 published with
    # verify-alpine red (a run-level failure is not loud enough).
    needs: [build-sdist, build-linux-wheels, build-macos-wheels,
            build-windows-wheels, test-wheels, verify-debian12, verify-rocky9,
            verify-rocky9-aarch64, verify-alpine, verify-winarm64,
            verify-macos-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dry-run path (workflow_dispatch + dry-run-release): executes the
    # artifact gather and the composition gate against this run's own
    # artifacts, then stops — upload and publish are workflow_run-only.
    # This is how the release plumbing gets exercised without a release.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run_release)
    permissions:
      contents: write
    steps:
      # upload-artifact v4+ does NOT merge same-name uploads, so every build job
      # uploads to a unique name (sdist, wheels-<os>-<arch>); this gather relies on
      # download-artifact v4+ `merge-multiple` to collect them all into dist/.
      # Keep the per-job names unique if you add build matrix entries.
      - name: Download release artifacts from this run (excludes musl canaries)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          pattern: "{sdist,wheels-*}"
          merge-multiple: true

      - name: List artifacts about to be released
        run: ls -lah dist/

      # Belt-and-braces for the {sdist,wheels-*} gather pattern: assert the
      # exact composition before anything publishes, so a pattern typo or a
      # renamed artifact fails here instead of shipping a partial release.
      # Counting uses nullglob arrays, NEVER `ls | wc -l`: under pipefail a
      # zero-match ls exits 2 and kills the script on the happy path (zero
      # musl wheels) before any check runs. The per-platform expectation is
      # derived from the distinct cpXY tags present in dist/, so a partial
      # gather (one platform artifact missing) fails loudly without a
      # hand-maintained version count.
      - name: Assert release composition before publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly 1 sdist, found ${#sdists[@]}" >&2; fail=1
          fi
          musl=(dist/*musllinux*.whl)
          if [ "${#musl[@]}" -ne 0 ]; then
            echo "ERROR: musl canaries are unpublished by policy (#333) but reached dist/:" >&2
            printf '%s\n' "${musl[@]}" >&2; fail=1
          fi
          wheels=(dist/*.whl)
          pyvers=$(printf '%s\n' "${wheels[@]}" | grep -oE 'cp3[0-9]+' | sort -u | wc -l)
          if [ "${pyvers}" -lt 4 ]; then
            echo "ERROR: only ${pyvers} distinct CPython tags in dist/ (expected >= 4)" >&2; fail=1
          fi
          # `pyvers - 1` mirrors the explicit CIBW_BUILD list in
          # build-winarm64-wheels (cp312-cp314, no cp311) — see the
          # comment there; the two must change together.
          winarm=(dist/*win_arm64*.whl)
          if [ "${#winarm[@]}" -ne $((pyvers - 1)) ]; then
            echo "ERROR: expected $((pyvers - 1)) win_arm64 wheels (cp311 excluded — no" >&2
            echo "       numpy/scipy ARM64 wheels), found ${#winarm[@]}" >&2; fail=1
          fi
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 "macosx*x86_64" "macosx*arm64" win_amd64; do
            # win_arm64 is asserted separately above (pyvers - 1 wheels).
            plat=(dist/*${tag}.whl)
            if [ "${#plat[@]}" -ne "${pyvers}" ]; then
              echo "ERROR: expected ${pyvers} ${tag} wheels (one per CPython tag), found ${#plat[@]}" >&2
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "release composition check FAILED — nothing was published" >&2
            exit 1
          fi
          echo "release composition OK: 1 sdist + ${#wheels[@]} wheels" \
            "(${pyvers} CPython x 5 platforms + $((pyvers - 1)) win_arm64)"

      - name: Dry run stops here — gather + gate passed, nothing published
        if: github.event_name == 'workflow_dispatch'
        run: echo "release dry run OK (composition gate passed); upload/publish skipped"

      - name: Resolve target release tag
        if: github.event_name == 'workflow_run'
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo '${{ github.repository }}' --json tagName --jq '.tagName')
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach wheels + sdist to the GitHub release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release-tag.outputs.tag }}' \
              dist/*.whl dist/*.tar.gz \
              --repo '${{ github.repository }}' \
              --clobber

      - name: Publish to PyPI
        if: github.event_name == 'workflow_run'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          password: ${{ secrets.PYPI_PUBLISH }}
          packages-dir: dist/
          skip-existing: true
          verbose: true
