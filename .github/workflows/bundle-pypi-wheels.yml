name: Bundle PyPI Wheels

on:
  push:
    branches: [main]
#   pull_request:
#     branches: [main]
#     paths:
#       - "pyproject.toml"
#       - "setup.py"
#       - "ci/**"
#       - ".github/workflows/bundle-pypi-wheels.yml"
  workflow_run:
    workflows: ["github-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build wheels from (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string

# Cancel superseded runs to free the hosted-runner pool, but only for pull_request builds —
# never cancel a push/workflow_run build, since those can publish wheels to PyPI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WHEEL_SIZE_BUDGET_MB: "120"
  # Uncompressed (install-footprint) ceiling enforced by ci/check-wheel-size.sh
  # (T3.1, #474). Generous backstop above the current per-platform footprint
  # (~143 MB Linux x86_64 post-#471); catches a regression without false-failing.
  WHEEL_INSTALLED_BUDGET_MB: "250"
  # Toolchain pins for the GDAL-extraction scripts (ci/setup-gdal-*.sh,
  # .ps1). macOS / Windows cibuildwheel runs before-all on the host and
  # inherits these directly; the Linux container build forwards them via
  # [tool.cibuildwheel.linux].environment-pass in pyproject.toml.
  PIXI_VERSION: "0.68.1"
  MICROMAMBA_VERSION: "2.6.1"

jobs:
  build-sdist:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # head_branch (not head_sha) — github-release pushes the bump + lockfile commits AFTER
          # the workflow_run head_sha is captured; we need the branch tip to see them.
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 3

  build-linux-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}

      - name: Report wheel sizes
        shell: bash
        run: |
          bash ci/check-wheel-size.sh wheelhouse
          # T3.2 (#474): best-effort size delta vs the previous PyPI release.
          # Non-fatal — never block the build on the comparison.
          python3 ci/wheel-size-delta.py wheelhouse || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  build-macos-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      # NOTE: the wheel size/leak gate (ci/check-wheel-size.sh) runs only in the
      # Linux build job. Adding it here trips CodeQL's cache-poisoning rule
      # (a repo script run in a workflow_run-triggered job). The data trim that
      # changes wheel size (install-and-vendor-osgeo.py) already runs on every
      # platform; only the post-build *assertion* is Linux-only. See #474 / the
      # PR review notes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  build-windows-wheels:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      # See the macOS job: the size/leak gate is Linux-only to avoid CodeQL's
      # cache-poisoning rule; the size-changing trim runs on all platforms.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 3

  test-wheels:
    needs: [build-linux-wheels, build-macos-wheels, build-windows-wheels]
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-2022]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: wheels-linux-x86_64
            wheel-tag: manylinux
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: wheels-linux-aarch64
            wheel-tag: manylinux
          - os: macos-14
            arch: arm64
            artifact: wheels-macos-arm64
            wheel-tag: macosx
          - os: windows-2022
            arch: AMD64
            artifact: wheels-windows-AMD64
            wheel-tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Install wheel
        shell: bash
        run: |
          PYTAG=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          WHEEL=$(ls dist/pyramids_gis-*-${PYTAG}-${PYTAG}-*${{ matrix.wheel-tag }}*.whl | head -1)
          echo "Installing: $WHEEL"
          pip install "$WHEEL"
          pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import
        run: python ci/verify-wheel.py

      - name: Run core test suite
        shell: bash
        # --timeout-method=thread: signal-based timeouts don't work on Windows.
        # Exclude vfs/slow: a few `core` tests (e.g. TestSubsetLiveNWM) also read
        # LIVE remote datasets over /vsicurl and flake on connection resets /
        # timeouts on the runners, intermittently failing the wheel smoke job.
        # The bundled wheel's network path is covered deterministically by
        # verify-wheel.py's /vsicurl CA check; this step stays hermetic.
        timeout-minutes: 10
        run: pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread -m "core and not vfs and not slow" tests/

  release:
    name: Publish to PyPI + attach to GitHub release
    needs: [build-sdist, build-linux-wheels, build-macos-wheels, build-windows-wheels, test-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    steps:
      # upload-artifact v4+ does NOT merge same-name uploads, so every build job
      # uploads to a unique name (sdist, wheels-<os>-<arch>); this gather relies on
      # download-artifact v4+ `merge-multiple` to collect them all into dist/.
      # Keep the per-job names unique if you add build matrix entries.
      - name: Download all artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts about to be released
        run: ls -lah dist/

      - name: Resolve target release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo '${{ github.repository }}' --json tagName --jq '.tagName')
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach wheels + sdist to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release-tag.outputs.tag }}' \
              dist/*.whl dist/*.tar.gz \
              --repo '${{ github.repository }}' \
              --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          password: ${{ secrets.PYPI_PUBLISH }}
          packages-dir: dist/
          skip-existing: true
          verbose: true
