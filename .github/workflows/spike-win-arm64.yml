name: spike-win-arm64

# #334 spike: build the pyramids wheel for Windows ARM64 from source via
# vcpkg (conda-forge has no win-arm64 GDAL). Also
# canary-builds shapely + pyogrio win_arm64 wheels against the same vcpkg
# prefix: neither ships win_arm64 wheels on PyPI yet, and both sit on
# pyramids' hard dependency chain, so publishing the pyramids wheel is
# gated on those upstreams (same model as the musl canaries, #333). The
# verify job installs all three and runs the full core suite natively —
# no emulation: the runner executes its own arch.
#
# Throwaway workflow: deleted when the job graduates into
# bundle-pypi-wheels.yml (same lifecycle as the #332 spike workflow).

on:
  push:
    branches: [spike/win-arm64-vcpkg]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-wheel:
    runs-on: windows-11-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The vcpkg-built tree is the expensive part (~40-70 min cold);
      # cache it keyed on everything that shapes it.
      - name: Cache the vcpkg-built GDAL stack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\vcpkg\installed
          key: >-
            vcpkg-arm64-${{
            hashFiles('ci/vcpkg.json', 'ci/setup-gdal-from-vcpkg.ps1') }}

      - name: Build wheel (cp312-win_arm64)
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_BUILD: "cp312-win_arm64"
          # Everything else (before-build vendor script, delvewheel repair,
          # the environment table with BUILD_PREFIX/GDAL_DATA/PROJ_DATA/
          # PATH) comes from [tool.cibuildwheel.windows] in pyproject.toml —
          # the vcpkg script stages the same C:/gdal-prefix/Library layout
          # the conda path produces, so only before-all differs.
          CIBW_BEFORE_ALL_WINDOWS: powershell -File ci/setup-gdal-from-vcpkg.ps1

      - name: Report wheel size
        shell: bash
        run: ls -lah wheelhouse/

      # Canary shapely + pyogrio: both lack win_arm64 wheels on PyPI and
      # both are hard requirements of pyramids (Shapely directly; pyogrio
      # via geopandas). Build them against the vcpkg prefix so the verify
      # job can exercise the FULL suite, and so the recipes double as
      # upstream contributions. Never published.
      - name: Build canary shapely + pyogrio wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GEOS_INCLUDE_PATH = "C:/gdal-prefix/Library/include"
          $env:GEOS_LIBRARY_PATH = "C:/gdal-prefix/Library/lib"
          $env:GDAL_INCLUDE_PATH = "C:/gdal-prefix/Library/include"
          $env:GDAL_LIBRARY_PATH = "C:/gdal-prefix/Library/lib"
          $env:GDAL_VERSION = Get-Content "C:/gdal-prefix/GDAL_VERSION"
          $env:PATH = "C:/gdal-prefix/Library/bin;$env:PATH"
          python -m pip install delvewheel
          python -m pip wheel "shapely==2.1.2" --no-deps --no-binary shapely -w canary-raw
          python -m pip wheel "pyogrio==0.13.0" --no-deps --no-binary pyogrio -w canary-raw
          New-Item -ItemType Directory -Force -Path canary-wheelhouse | Out-Null
          Get-ChildItem canary-raw/*.whl | ForEach-Object {
            delvewheel repair --add-path C:/gdal-prefix/Library/bin -w canary-wheelhouse $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "delvewheel repair failed for $($_.Name)" }
          }
          Get-ChildItem canary-wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spike-wheel-win-arm64
          path: wheelhouse/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-deps-win-arm64
          path: canary-wheelhouse/*.whl

  verify:
    needs: build-wheel
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spike-wheel-win-arm64
          path: wheelhouse

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: canary-deps-win-arm64
          path: canary-wheelhouse

      # Canaries first: with shapely + pyogrio distributions present, the
      # rest of the dependency tree resolves normally from PyPI (numpy,
      # pandas, scipy, pyproj, cftime all ship win_arm64 wheels).
      - name: Install wheel + canary deps
        shell: bash
        run: |
          pip install canary-wheelhouse/shapely-*.whl canary-wheelhouse/pyogrio-*.whl
          WHEEL=$(ls wheelhouse/pyramids_gis-*cp312*win_arm64.whl)
          pip install "${WHEEL}"
          pip install pytest pytest-env pytest-mock pytest-timeout

      - name: Verify GDAL import + drivers (netCDF, JP2, TLS)
        run: python ci/verify-wheel.py

      - name: Run hermetic core test suite
        shell: bash
        timeout-minutes: 15
        run: >-
          pytest -vvv -o "pythonpath=" --timeout=60 --timeout-method=thread
          -m "core and not vfs and not slow" tests/
