name: Tests - Suite

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs: a new push to a PR cancels the previous in-progress run
# instead of letting both compete for the (limited, especially macOS) hosted-runner pool.
# main is exempt — every commit merged to main must run the full suite independently, so a
# later merge never cancels an earlier commit's verification. main gets a unique run_id group
# (never shared, never cancelled); PRs keep the per-ref group with cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # Bound a hung test (e.g. a flaky kerchunk/fsspec read in the xarray step) so the
    # job fails in minutes instead of running to GitHub's 6-hour default. The full
    # matrix completes in well under this; faulthandler_timeout (pyproject) dumps the
    # offending thread stacks into the log before the cap hits.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        environment: [py311, py312, py313, py314]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      - name: Run main tests (not plot, not xarray, not vfs, not live)
        # Run pytest directly (not the `main` task) so we can append `not vfs`/`not live`
        # to the selector — the live-network vfs/live tests must not run in CI. Editing
        # the pixi `main` task in pyproject.toml would invalidate pixi.lock and fail the
        # lock-freshness check, so the deselection lives here instead.
        run: pixi run -e ${{ matrix.environment }} pytest -vvv --cov=src/pyramids -sv -m 'not plot and not xarray and not vfs and not live' --cov-report=xml --cov-append --cov-fail-under=0

      - name: Run plot tests
        run: pixi run -e ${{ matrix.environment }} plot --cov-fail-under=0

      - name: Run xarray tests
        run: pixi run -e ${{ matrix.environment }} xarray-tests --cov-fail-under=84

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0

      - name: test Jupyter notebooks
        run: pixi run -e ${{ matrix.environment }} notebooks

  extras-package:
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # One job per [project.optional-dependencies] group that ships native
    # deps (conda-forge backed). Each job installs the matching
    # ``dev-<extra>`` pixi env and runs only the tests tagged with the
    # extra's pytest marker. Tests auto-skip on missing deps via the
    # ``pytest_collection_modifyitems`` hook in tests/conftest.py, so
    # this job is the only place the extra-gated suite actually runs.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target:
          # ``dir`` is the subdirectory that exercises the extra's code
          # paths. Keeping CI subdir-scoped avoids re-running the full
          # suite in every extras env while still covering the code
          # that each extra activates.
          - { name: netcdf_lazy,  env: lazy,         dir: tests/netcdf/lazy }
          - { name: parquet_lazy, env: parquet,      dir: tests/feature/lazy }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: ${{ matrix.target.env }}
          activate-environment: ${{ matrix.target.env }}
          cache: true
          version: v0.73.0

      - name: Run ${{ matrix.target.name }} tests
        # ``--cov-fail-under=0`` overrides the 90% gate from
        # ``[tool.coverage.report]``; extras jobs are intentionally
        # narrow-scope and their coverage is aggregated with the main
        # job at Codecov.
        run: >-
          pixi run -e ${{ matrix.target.env }}
          pytest -vvv ${{ matrix.target.dir }} -m 'not live'
          --cov=src/pyramids --cov-report=xml --cov-report=term-missing
          --cov-fail-under=0

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
