name: Pure Wheel - Build & Test

# Validates the CONDA-FORGE install path: build a pure-Python wheel
# from the sdist, install it on top of a conda env that provides GDAL
# as a system package (the same shape as the conda-forge feedstock and
# end users installing from conda). Complements
# .github/workflows/bundle-pypi-wheels.yml's `test-wheels` job, which
# validates the OTHER install path — a platform wheel with native
# libraries vendored in (`pip install pyramids-gis`, no conda).
#
# This workflow also runs a per-extra matrix (one job per
# [project.optional-dependencies] entry) to verify that each extra's
# headline dep is enough to make its marker-scoped tests pass; that
# coverage is not duplicated in bundle-pypi-wheels.yml.

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build and test (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
  workflow_call:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Pixi
        uses: serapeum-org/github-actions/actions/python-setup/pixi@cb1baebe72f571981605ab895a45dae7bfb566ba # pixi/v1
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Build wheel
        run: pixi run -e dev python -m build --wheel --outdir dist/

      - name: Verify package data in wheel
        run: |
          pixi run -e dev python -m zipfile -l dist/*.whl | grep "base/data/config.yaml"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel
          path: dist/*.whl

  # Core wheel test: install the bare wheel (no optional extras) across
  # OS × Python, and run the subset of the test suite that is supposed
  # to run on a minimal install. Any extras-gated test must auto-skip
  # via ``tests/conftest.py``'s ``pytest_collection_modifyitems`` hook.
  test-wheel-core:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install native GDAL dependencies
        shell: bash -el {0}
        # Single source of truth: the gdal pin is read from
        # [tool.pixi.feature.wheel-build.dependencies] via ci/gdal-pin.py, so this
        # conda-forge-shape test installs the same gdal the wheels are built and
        # shipped against and the range can never drift out of sync here.
        run: |
          spec=$(python ci/gdal-pin.py)
          echo "Using GDAL pin from wheel-build: ${spec}"
          conda install -y -n wheel-test \
            "gdal${spec}" \
            "libgdal-netcdf${spec}" \
            "libgdal-hdf4${spec}" \
            "libgdal-grib${spec}"

      - name: Install wheel (no extras)
        shell: bash -el {0}
        run: "pip install dist/*.whl --only-binary=:all:"

      - name: Verify package import
        shell: bash -el {0}
        run: python -c "import pyramids; print(pyramids.__version__)"

      - name: Install test runner
        shell: bash -el {0}
        run: "pip install pytest pytest-env pytest-mock --only-binary=:all:"

      - name: Run core tests
        shell: bash -el {0}
        # ``core`` is an explicit ``pytestmark = pytest.mark.core`` on every
        # extras-free test module. Tests that need an optional dependency carry
        # the matching extras marker instead (``xarray`` / ``lazy`` / …), and
        # tests/conftest.py's ``pytest_collection_modifyitems`` auto-applies the
        # corresponding ``requires_<extra>`` skip to those — so ``-m core`` here
        # selects only the bare-install tests and never collects an extras test.
        # ``not vfs`` deselects the live-network (S3/HTTP) tests, which are marked
        # ``vfs`` and must not run in CI.
        run: |
          pytest -vvv -sv -m "core and not vfs" tests/

  # Per-extra wheel test: one job per optional extra. Each matrix cell
  # gets a freshly-provisioned conda env, installs the wheel with just
  # that one extra (``pip install "pyramids-gis[X]"``), and runs ONLY
  # the tests tagged with the matching ``@pytest.mark.<marker>``. This
  # isolates extras so that a broken [X] extra can't mask / be masked
  # by a working [Y] install, and verifies that each extra's headline
  # dep is enough to run its tests (no hidden transitive reliance on
  # another extra).
  test-wheel-extras:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Hold OS / Python fixed; the core matrix above covers that
        # dimension. The point of this job is extras × pip semantics.
        os: [ubuntu-latest]
        python-version: ["3.13"]
        extra:
          - { name: viz,          pip_extra: "viz",          marker: "plot",         dir: "tests/" }
          # xarray is not a pyramids extra (it's a peer interop dep) — install it
          # directly via `extra_pip`. The xarray-marked tests also include the
          # LabeledDataset reader, which needs the lazy data stack (zarr / dask /
          # s3fs) to open Zarr stores, chunk, and read remote URLs — hence [lazy].
          - { name: xarray,       pip_extra: "lazy",         extra_pip: "xarray",    marker: "xarray",       dir: "tests/" }
          - { name: lazy,         pip_extra: "lazy",         marker: "lazy",         dir: "tests/" }
          - { name: netcdf_lazy,  pip_extra: "lazy",         marker: "netcdf_lazy",  dir: "tests/netcdf/lazy" }
          - { name: parquet,      pip_extra: "parquet",      marker: "parquet",      dir: "tests/feature" }
          - { name: parquet_lazy, pip_extra: "parquet",      marker: "parquet_lazy", dir: "tests/feature/lazy" }

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install native GDAL dependencies
        shell: bash -el {0}
        # Single source of truth: the gdal pin is read from
        # [tool.pixi.feature.wheel-build.dependencies] via ci/gdal-pin.py, so this
        # conda-forge-shape test installs the same gdal the wheels are built and
        # shipped against and the range can never drift out of sync here.
        run: |
          spec=$(python ci/gdal-pin.py)
          echo "Using GDAL pin from wheel-build: ${spec}"
          conda install -y -n wheel-test \
            "gdal${spec}" \
            "libgdal-netcdf${spec}" \
            "libgdal-hdf4${spec}" \
            "libgdal-grib${spec}"

      - name: Install wheel with only [${{ matrix.extra.name }}] extra
        shell: bash -el {0}
        run: |
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[${{ matrix.extra.pip_extra }}]" --only-binary=:all:
          # Peer interop deps that are not pyramids extras (e.g. xarray).
          if [ -n "${{ matrix.extra.extra_pip }}" ]; then
            pip install "${{ matrix.extra.extra_pip }}" --only-binary=:all:
          fi

      - name: Verify package import
        shell: bash -el {0}
        run: python -c "import pyramids; print(pyramids.__version__)"

      - name: Install test runner
        shell: bash -el {0}
        run: "pip install pytest pytest-env pytest-mock --only-binary=:all:"

      - name: Run ${{ matrix.extra.marker }}-marked tests
        shell: bash -el {0}
        run: |
          pytest -vvv -sv \
            -m "${{ matrix.extra.marker }}" \
            ${{ matrix.extra.dir }}
