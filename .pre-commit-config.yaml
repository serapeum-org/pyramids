fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        name: "[py -  check] check toml"
      - id: end-of-file-fixer
        name: "[file - format] end of file"
      - id: no-commit-to-branch
        name: "[git -  check] no commit to branch"
        args: [ --branch=main ]
      - id: trailing-whitespace
        name: "[file - format] trim trailing whitespace"
        args: [ --markdown-linebreak-ext=md ]
      - id: check-added-large-files
        name: "[file -  check] large file"
        args: [ --maxkb=2000 ]
      - id: check-docstring-first
        name: "[py   -  check] docstring first"
        files: /examples
        types : [file, python ]
      - id: check-json
        name: "[json -  check] validate json"
      - id: check-merge-conflict
        name: "[git  -  check] merge conflict"
      - id: debug-statements
        name: "[py   -  check] debug statements"
      - id: detect-private-key
        name: "[cred -  check] private keys"
      - id: mixed-line-ending
        name: "[file - format] mixed line ending"
        args: [ --fix=auto ]
      - id: pretty-format-json
        name: "[json - format] pretty json"
        # Exclude notebooks: .ipynb is JSON, but jupyter/nbformat owns its serialization
        # (indent=1, ensure_ascii=False). pretty-format-json's --indent=4 + ascii escapes
        # rewrite every notebook into a huge spurious diff on each run (and re-break the
        # code cells' unicode). Notebook code is already handled by ruff.
        exclude: \.ipynb$
        args: [ --autofix,
                --indent=4,
                --no-sort-keys ]
      - id: requirements-txt-fixer
        name: "[reqs - format] fix requirements.txt"
      - id: check-yaml
        name: "[yaml -  check] validate yaml"
        exclude: mkdocs\.yml
  # Ruff replaces black + isort + flake8 + pyupgrade and their nbqa notebook
  # wrappers. One engine and one line-length ruler mean the formatter and the
  # import sorter can't disagree the way black and isort did (a long trailing
  # comment on an import). Ruff lints and formats both .py and .ipynb natively.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: "[py   -   lint] ruff"
        args: [--fix]
      - id: ruff-format
        name: "[py   - format] ruff-format"

  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.4.3
    hooks:
      - id: beautysh
        name: "[bash - format] beautysh"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "[bash -   lint] shellcheck"
        # SC2218 (false positive on our define-then-dispatch build scripts), SC2012
        # (ls vs find) and SC2001 (sed vs ${//}) are intentional — excluded inline
        # here instead of via a separate .shellcheckrc file.
        args: ["--exclude=SC2218,SC2012,SC2001"]

  - repo: https://github.com/rlindsgaard/pre-commit-commit-msg-hooks
    rev: 0.1.0
    hooks:
      - id: check-description-max-length
        name: "[bash -   format] check-description-max-length"
      - id: check-second-line-empty
        name: "[bash -   format] check-second-line-empty"
      - id: check-summary-capitalized
        name: "[bash -   format] check-summary-capitalized"
      - id: check-summary-imperative
        name: "[bash -   format] check-summary-imperative"
      - id: check-summary-max-length
        name: "[bash -   format] check-summary-max-length"
      - id: check-summary-punctuation
        name: "[bash -   format] check-summary-punctuation"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.(ipynb|drawio)$'
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.8
    hooks:
      - id: checkov

  # The local hooks below run inside the pixi `dev` environment. `--frozen` uses
  # pixi.lock as-is — without it pixi re-solves every platform on each hook run,
  # which is slow and can hang. `-p no:cacheprovider` stops pytest writing to
  # .pytest_cache, which fails with WinError 183 on this Google-Drive-synced tree.
  - repo: local
    hooks:
      - id: mypy
        name: "[py   -  type] mypy"
        entry: pixi run --frozen -e dev mypy
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pixi run --frozen -e dev pytest -v --cov=src/pyramids --cov-report=term-missing -m "not plot" -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: doctest
        name: doctest
        entry: pixi run --frozen -e dev python -c 'import matplotlib; matplotlib.use("Agg"); import pytest; import sys; sys.exit(pytest.main(["--doctest-modules", "src", "-p", "no:cacheprovider"]))'
        language: system
        always_run: true
        # The entry hardcodes `--doctest-modules src`, so staged filenames would land
        # unused in sys.argv[2:]. Match pytest-check: run the fixed sweep, pass no names.
        pass_filenames: false

  - repo: local
    hooks:
      - id: notebook-check
        name: nbval
        entry: pixi run --frozen -e dev pytest --nbval --nbval-lax --verbose -p no:cacheprovider
        language: system
        # Gate strictly on notebooks. With always_run, a commit touching no .ipynb
        # passed zero filenames, so pytest fell back to testpaths=["tests"] and ran
        # the regular suite instead of the notebooks (duplicating pytest-check).
        files: \.ipynb$
        # These two read live external data, so they cannot gate a commit: AWS
        # revoked anonymous access to the ERA5 bucket outright, and Overture keeps
        # only the two most recent releases, so any pinned date expires within
        # months. Run them by hand when editing them.
        exclude: ^docs/examples/(feature/dask-lazy-features|netcdf/dask-lazy-netcdf)\.ipynb$
        # One pytest session for every notebook passed. Otherwise pre-commit splits
        # the files across concurrent processes, producing several independent
        # sessions and letting notebooks that write into docs/examples/ collide.
        require_serial: true

  - repo: local
    hooks:
      # Fail the commit if pixi.lock is stale relative to pyproject.toml.
      # `pixi lock --check` re-solves from the manifest and exits non-zero
      # if the lockfile would change — exactly the silent-drift bug from
      # PR review M4. Only fires when pyproject.toml or pixi.lock is
      # staged so unrelated commits don't pay the network round-trip;
      # skip locally with `SKIP=pixi-lock-check git commit ...`.
      - id: pixi-lock-check
        name: "[pixi -  check] pixi.lock up to date"
        entry: pixi lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|pixi\.lock)$
